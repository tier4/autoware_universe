/**:
  ros__parameters:
    control_metrics:
      output_metrics: false
      output_metrics_only_moving:
        enabled: true
        metric_list:
          - closest_object_distance
      planning_factor_metrics:
        topic_prefix: /planning/planning_factors/
        stop_deviation:
          module_list:
            - blind_spot
            - crosswalk
            - detection_area
            - intersection
            - merge_from_private
            - no_drivable_lane
            - no_stopping_area
            - stop_line
            - traffic_light
            - virtual_traffic_light
            - walkway
      object_metrics:
        distance_filter_thr_m: 30.0
