# Deployment defaults for the LatentDrive deployment of the E2E planner node.
#
# The package's e2e_planner.param.yaml also carries another model's bev_feature block that
# looks up the autoware_tensorrt_plugins package share directory; launch resolves that
# substitution eagerly, even inside comments, and fails on a vehicle without that package.
# This file is that file minus the blocks LatentDrive never reads.
# Everything the NETWORK dictates lives in ml_package_latentdrive.param.yaml beside the ONNX.
/**:
  ros__parameters:
    # -- artifacts: the location is the deployment's business, the file names
    #    come from the launch arguments --
    model_path: $(var model_path)/$(var planner_onnx)
    plugins_path: ""  # planner graphs so far need no custom plugins
    args_path: ""  # set when a model needs external normalization statistics
    build_only: false

    # fp32 by default: a planner graph that embeds normalization statistics can
    # exceed the fp16 range, and TensorRT clips silently rather than failing.
    # A model whose graph is validated in fp16 says so in its ml_package file.
    precision: "fp32"

    # TensorRT builder workspace. Below a graph's requirement the builder does
    # not degrade gracefully — it segfaults. Measured on the ResWorld planner
    # graph with TensorRT 10.16 (2026-09-03): 4 GiB and 8 GiB both dump core,
    # 16 GiB builds. 4 GiB did build the same graph family a day earlier, so
    # the threshold moves with what else holds GPU memory and with the tactics
    # the builder then picks — leave real headroom rather than the minimum that
    # happened to work. The limit caps the builder's scratch; it is not an
    # allocation, so a host with less memory is not harmed by a high value.
    # This is a property of the deployment host.
    trt_workspace_mib: 16384

    # -- runtime --
    planning_frequency_hz: 10.0
    # "camera": tick on each camera 0 frame as it arrives (at most planning_frequency_hz), so the
    # newest frame is always as fresh as decode allows and the side views are paired the same way
    # every tick. "timer": a free-running timer, whose phase against the camera trigger is set by
    # when the node happened to start (newest frame 0-100 ms older, fixed for the run).
    tick_trigger: "camera"
    shift_x: false

    latentdrive:
      # Where the subgoal's reference polyline comes from: "route" follows the lanelet
      # centerlines of /planning/mission_planning/route (the deployment form, needs the
      # vector map); "trajectory" follows a Trajectory topic, for a replay whose bags
      # carry no route.
      subgoal_source: "route"
      # Newest-frame staleness at the planning tick. The front-camera JPEG stream
      # itself arrives 40-60 ms behind the clock, but decode, preprocessing and
      # inference share one executor thread, so a busy tick can see a frame that
      # is one period older than that. 200 ms dropped such ticks on the replay
      # host; 300 ms keeps the 10 Hz output without accepting a two-frame lag.
      max_delay_ms: 300.0
      frame_interval_tolerance_seconds: 0.15
      # Multi-view models: each chosen camera 0 frame is paired with the other camera's nearest
      # frame, which may be at most this far from it in time. The cameras are triggered by the
      # lidar sweep at a fixed phase (on 0ed0b1e4 the side cameras sit 14 ms before and after
      # camera 0), so the nearest frame is always the one training paired. A view triggered after
      # camera 0 that has not arrived yet is waited for, at most this long after the camera 0
      # frame arrived. A view still missing then is handled by missing_view_fill.
      view_sync_tolerance_seconds: 0.05
      # "skip" (default) skips the tick; "zeros" feeds an all-zero image in that slot. Set per
      # model by its ml_package file: the three-camera models were trained with zero-filled
      # missing views, the two-view idx9 line was not.
      missing_view_fill: "skip"
      # Temporal smoothing of the plan, ported from LatentDrive-TRT's display filter and
      # re-anchored on measured ego motion. On by default: the raw plan jitters by about
      # a metre in reach from tick to tick, and the filter trades roughly
      # (1 - alpha) / alpha ticks of lag for a steady reference. The raw output is still
      # published as the `_raw` candidate, which is what open-loop accuracy is measured on.
      smoothing:
        enable: true
        alpha: 0.35  # weight of the fresh plan; 1.0 disables the blend
        reset_jump_m: 8.0  # a larger end-point jump is a new decision, passed through
        max_gap_seconds: 1.0  # a longer gap (or a step back in time) drops the state
        # The `_raw` candidate shares its generator id with the filtered one, so turn it off
        # where the candidates feed a planning chain rather than an offline comparison.
        publish_raw_candidate: true

    postprocess:
      velocity_smoothing_window: 8
      stopping_threshold: 0.3
