# Deployment defaults for the E2E planner node — MODEL-AGNOSTIC.
#
# Nothing here may be specific to one network. Everything a particular model
# dictates — tensor names, voxelization geometry, temporal contract, horizon,
# and the precision its graph tolerates — lives in
# `ml_package_<model>.param.yaml` NEXT TO THE ARTIFACTS (the autoware_bevfusion
# convention). The launch file loads this file first and the ml_package second,
# so a model's values override these defaults without editing the package.
#
# Deploying another model or a re-trained variant is therefore a `model_name` /
# `model_path` change, with no edit here and no rebuild.
/**:
  ros__parameters:
    # -- artifacts: the location is the deployment's business, the file names
    #    come from the launch arguments --
    model_path: $(var model_path)/$(var planner_onnx)
    plugins_path: ""  # planner graphs so far need no custom plugins
    args_path: ""  # set when a model needs external normalization statistics
    build_only: false

    # fp32 by default: a planner graph that embeds normalization statistics can
    # exceed the fp16 range, and TensorRT clips silently rather than failing.
    # A model whose graph is validated in fp16 says so in its ml_package file.
    precision: "fp32"

    # TensorRT builder workspace, an upper bound on the builder's scratch (not an
    # allocation). 4 GiB builds both ResWorld engines (TensorRT 10.16, measured
    # 2026-09-09, 24 of 24 builds). An earlier note here claimed the builder
    # segfaults below 16 GiB; those crashes were the build host's CPU faulting
    # at boost clock, not TensorRT, and the value went back to 4 GiB. Raise it
    # only for a graph whose build reports insufficient workspace.
    trt_workspace_mib: 4096

    # -- runtime --
    shift_x: false

    bev_feature:
      # Cache semantics (frames, interval, extent, tensor names) describe the
      # network and come from the model's ml_package file; what is left here is
      # host behaviour.
      interval_tolerance_seconds: 0.02
      warmup: "wait"  # "wait" or "duplicate_current"
      max_delay_ms: 200.0
      extractor:
        engine_path: ""  # empty: cached beside the ONNX, as TrtCommon does
        onnx_path: $(var model_path)/$(var extractor_onnx)
        plugins_path: $(find-pkg-share autoware_tensorrt_plugins)/plugins/libautoware_tensorrt_plugins.so
        precision: "fp16"  # sparse-conv feature extractors are validated in fp16
        cloud_capacity: 2000000

    context:
      traffic_light_group_msg_timeout_seconds: 0.2
      # Subscribe to the turn-indicator report for a model that declares the
      # tensor. A model whose graph carries it but never reads it (ResWorld:
      # perturbing the input changes nothing) sets this false in its ml_package
      # file; the node then binds a constant and subscribes to nothing.
      turn_indicators:
        enabled: true
      line_string_max_step_m: 5.0
      use_time_interpolation: false

    postprocess:
      velocity_smoothing_window: 8
      stopping_threshold: 0.3

    # Stop and slow-down factors derived from the published trajectory, the way
    # autoware_diffusion_planner derives them, for the consumers of a trajectory
    # generator. Same defaults as that node's shipped configuration.
    # Off by default: stop/slowdown labeling lives in trajectory_modifier's
    # ModelPlanningFactorID plugin (published as
    # /planning/planning_factors/neural_network_planner), which applies to any
    # learning-based planner downstream of this node. Turning this on as well
    # reports the same stop twice. Matches the deployment config in
    # autoware_launch (neural_net_planner/e2e_planner.param.yaml and
    # diffusion_planner.param.yaml since 2026-09-09).
    planning_factor:
      enable_stop: false
      enable_slowdown: false
      stop_velocity_threshold: 0.1
      stop_keep_duration_threshold: 1.0
      slowdown_accel_threshold: -0.3
