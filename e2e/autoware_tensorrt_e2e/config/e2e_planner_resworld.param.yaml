# Deployment configuration: ResWorld (OnePlanner) — the first supported model.
#
# Two-stage temporal LiDAR pipeline:
#   concatenated point cloud -> frozen BEVFusion-L feature extractor (TensorRT, spconv plugins)
#   -> 3-frame temporal cache with SE(2) warp -> planner ONNX -> 40-point / 4 s trajectory.
#
# The planner ONNX embeds observation normalization ("raw_t4_planner_tensors"), so args_path
# stays empty. Cache semantics (frames, interval, half extent) are read from the deployment
# contract JSON shipped beside the planner ONNX.
/**:
  ros__parameters:
    model_path: $(var data_path)/resworld_planner.simplified.onnx
    plugins_path: ""  # The planner graph itself needs no custom plugins
    precision: "fp16"
    args_path: ""  # Normalization is embedded in the planner graph
    build_only: false
    planning_frequency_hz: 10.0
    shift_x: false

    sensor_inputs: ["bev_feature"]
    enable_context_inputs: true

    bev_feature:
      history_tensor: "bev_feature_history"
      # Single source of truth for the temporal contract (frames, interval, half extent,
      # feature tensor name); ROS parameters below are the fallback.
      contract_path: $(var data_path)/resworld_deployment_contract.json
      frames: 3
      interval_seconds: 0.1
      interval_tolerance_seconds: 0.02
      bev_half_extent_m: 122.4
      warmup: "wait"  # "wait" or "duplicate_current"
      max_delay_ms: 200.0
      extractor:
        # Frozen BEVFusion-L feature extractor (lidar branch of the production BEVFusion,
        # exported with `bev_feature` as an output). Voxelization parameters must match the
        # BEVFusion ml package this extractor was exported from.
        onnx_path: $(var data_path)/bevfusion_lidar_feature.onnx
        plugins_path: $(find-pkg-share autoware_tensorrt_plugins)/plugins/libautoware_tensorrt_plugins.so
        precision: "fp16"
        feature_tensor: "bev_feature"
        cloud_capacity: 2000000
        # Matches the frozen BEVFusion-L training voxelizer (AWML gen2: max_num_points=32);
        # the exported ONNX bakes this as the voxels tensor's second dimension.
        max_points_per_voxel: 32
        voxels_num: [1, 128000, 256000]  # [min, opt, max]
        point_cloud_range: [-122.4, -122.4, -3.0, 122.4, 122.4, 5.0]
        voxel_size: [0.17, 0.17, 0.2]
        # The frozen BEVFusion-L consumes 5 point features [x, y, z, intensity, time];
        # the training loader zeroes the time column and the VFE normalizes intensity 0-255.
        use_intensity: true

    context:
      traffic_light_group_msg_timeout_seconds: 0.2
      ignore_neighbors: false
      ignore_unknown_neighbors: true
      line_string_max_step_m: 5.0
      use_time_interpolation: false

    postprocess:
      prediction_tensor: "trajectory"
      extra_trajectory_tensors: ["prior_trajectory"]
      horizon_seconds: 4.0  # 40 points at 0.1 s
      time_step: 0.1
      velocity_smoothing_window: 8
      stopping_threshold: 0.3
      generator_name: "TensorrtE2eResWorld"
