/**:
  ros__parameters:
    # If the number of consecutive invalid predicted_path exceeds this threshold, the Diag will be set to ERROR.
    # (For example, threshold = 1 means, even if the predicted_path is invalid, Diag will not be ERROR if
    #  the next predicted_path is valid.)
    diag_error_count_threshold: 0

    display_on_terminal: false # show error msg on terminal

    vel_lpf_gain: 0.9 # Time constant 0.33

    acceleration_validator:
      acc_error_offset: 0.8
      acc_error_scale: 0.2
      acc_lpf_gain: 0.97 # Time constant 1.11s

    uncrossable_bound_departure_validator:
      enable: true
      boundary_types: ["road_border"]
      lateral_margin_m: 0.01
      longitudinal_margin_m: 1.0
      max_deceleration_mps2: -4.0
      max_jerk_mps3: -5.0
      brake_delay_s: 1.0
      time_to_departure_cutoff_s: 2.0
      on_time_buffer_s: 0.20
      off_time_buffer_s: 0.10
      enable_align_to_ego_pose: true
      enable_developer_marker: false
      caution_departure_lateral_th_m: 0.3
      caution_on_time_buffer_s: 0.20
      caution_off_time_buffer_s: 0.10

    hazard_warning:
      enable: true
      braking:
        reaction_times: [2.0, 1.5, 1.0] # descending; hazard levels 1 to 3
        deceleration: 6.0
      collision_cos_threshold: 0.0 # -1 disables the collision angle condition
      min_alert_duration: 0.5
      prediction_horizon: 5.0
      time_resolution: 0.1
      stop_velocity: 0.1
      vehicle_yaw:
        rear_axle_ratio: 0.3
      enabled_object_classes: [car, truck, bus, trailer, motorcycle, bicycle, pedestrian]
      enable_pointcloud: true
      enable_road_border: true
      max_evaluations:
        object: 10
        pointcloud: 10
      max_objects_stamp_gap_s: 0.5
      objects:
        max_stamp_gap_s: 0.3
      sector:
        radius_m: 60.0
        boundary_tolerance_deg: 1.0
        range:
          front: [-10.0, 10.0]
          front_left: [10.0, 30.0]
          left: [30.0, 150.0]
          rear_left: [150.0, 170.0]
          rear: [170.0, -170.0]
          rear_right: [-170.0, -150.0]
          right: [-150.0, -30.0]
          front_right: [-30.0, -10.0]
      pointcloud:
        roi:
          rear: 2.0
          front_margin: 2.0
          lateral: 5.0
          z_margin_low: 0.0 # added to the vehicle min height offset (ground)
          z_margin_high: -0.35 # added to the vehicle max height offset (vehicle height)
        max_points: 20000
        voxel_size: 0.10
        cluster_tolerance: 0.30
        min_cluster_size: 10
        max_stamp_gap_s: 0.1
        object_margin:
          front: 0.5
          rear: 1.5
          left: 0.4
          right: 0.4
      debug:
        publish_markers: true
        csv_path: ""

    latency_validator:
      nominal_latency: 0.01

    lateral_jerk_validator:
      lateral_jerk: 10.0

    overrun_validator:
      assumed_delay_time: 0.2
      assumed_limit_acc: 5.0
      overrun_stop_point_dist: 0.8
      will_overrun_stop_point_dist: 1.0

    trajectory_validator:
      max_distance_deviation: 1.0

    velocity_validator: # previously over_velocity
      hold_velocity_error_until_stop: true
      rolling_back_velocity: 0.5
      over_velocity_offset: 2.0
      over_velocity_ratio: 0.2
      # Longer time constant to avoid reacting to instantaneous velocity changes
      vel_lpf_gain: 0.985 # Time constant 2.0s at 30msec sampling period

    yaw_validator:
      yaw_deviation_error: 1.0
      yaw_deviation_warn: 0.5
