control_validator:
  diag_error_count_threshold:
    type: int
    description: If the number of consecutive invalid predicted_path exceeds this threshold, the Diag will be set to ERROR.

  display_on_terminal:
    type: bool
    description: Show error message on terminal.

  vel_lpf_gain:
    type: double
    description: Low-pass filter gain for filtering vehicle and target velocity.

  acceleration_validator:
    acc_error_offset:
      type: double
      description: Offset threshold to validate the vehicle acceleration.
    acc_error_scale:
      type: double
      description: Scale threshold to validate the vehicle acceleration.
    acc_lpf_gain:
      type: double
      description: Low-pass filter gain for the acceleration validator.

  uncrossable_bound_departure_validator:
    enable:
      type: bool
      description: If true, validate that the control predicted trajectory does not depart an uncrossable boundary.
    boundary_types:
      type: string_array
      description: Lanelet linestring types treated as uncrossable boundaries.
    lateral_margin_m:
      type: double
      description: Lateral margin from the boundary [m].
    longitudinal_margin_m:
      type: double
      description: Longitudinal margin from the boundary [m].
    max_deceleration_mps2:
      type: double
      description: Maximum deceleration used for the braking-distance estimation [m/s^2].
    max_jerk_mps3:
      type: double
      description: Maximum jerk used for the braking-distance estimation [m/s^3].
    brake_delay_s:
      type: double
      description: Assumed brake delay [s].
    time_to_departure_cutoff_s:
      type: double
      description: Time-to-departure cutoff beyond which a departure is not treated as critical [s].
    on_time_buffer_s:
      type: double
      description: Continuous-violation time required to activate a critical departure [s].
    off_time_buffer_s:
      type: double
      description: Continuous-safety time required to deactivate a critical departure [s].
    enable_align_to_ego_pose:
      type: bool
      description: Correct the trajectory poses near the ego vehicle to match the measured ego pose.
    enable_developer_marker:
      type: bool
      description: If true, publish developer debug markers from the boundary departure checker.
    caution_departure_lateral_th_m:
      type: double
      description: Lateral margin from the boundary for the CAUTION warning stage [m]. NaN disables the stage.
    caution_on_time_buffer_s:
      type: double
      description: Continuous-violation time required to activate a CAUTION departure [s].
    caution_off_time_buffer_s:
      type: double
      description: Continuous-safety time required to deactivate a CAUTION departure [s].

  hazard_warning:
    enable:
      type: bool
      description: If true, run the collision / boundary departure hazard warning.
    ttc_threshold_on:
      type: double
      description: TTC below which a collision warning is raised [s]. NaN disables the warning.
    ttc_thresholds:
      type: double_array
      description: Hazard level boundaries in descending order [s]. The first element equals ttc_threshold_on.
    collision_cos_threshold:
      type: double
      description: Lower bound of the cosine of the collision angle for a collision warning. -1 disables the condition.
    min_alert_duration:
      type: double
      description: Minimum time a raised warning is held after the last raw detection [s].
    prediction_horizon:
      type: double
      description: Upper bound of the evaluated time horizon of the predicted trajectory [s].
    time_resolution:
      type: double
      description: Time step of the footprint sweep [s].
    stop_velocity:
      type: double
      description: Sweep steps where the absolute velocity of the predicted trajectory is below this value are not judged [m/s].
    enabled_object_classes:
      type: string_array
      description: Object classification labels that raise a collision warning.
    enable_pointcloud:
      type: bool
      description: If true, pointcloud clusters raise a collision warning.
    enable_road_border:
      type: bool
      description: If true, a CAUTION boundary departure raises a departure warning.
    max_evaluations:
      object:
        type: int
        description: Maximum number of objects evaluated per cycle (closest first).
      pointcloud:
        type: int
        description: Maximum number of pointcloud clusters evaluated per cycle (closest first).
    max_objects_stamp_gap_s:
      type: double
      description: Objects older than this relative to the predicted trajectory are not evaluated [s].
    objects:
      max_stamp_gap_s:
        type: double
        description: Maximum time difference between the pointcloud stamp and the objects used to remove duplicated clusters [s].
    sector:
      radius_m:
        type: double
        description: Radius of the sector wedges used for sector assignment [m].
      boundary_tolerance_deg:
        type: double
        description: Angular tolerance added to both ends of each sector [deg].
      range:
        front:
          type: double_array
          description: Bearing range of the FRONT sector [deg].
        front_left:
          type: double_array
          description: Bearing range of the FRONT_LEFT sector [deg].
        left:
          type: double_array
          description: Bearing range of the LEFT sector [deg].
        rear_left:
          type: double_array
          description: Bearing range of the REAR_LEFT sector [deg].
        rear:
          type: double_array
          description: Bearing range of the REAR sector [deg].
        rear_right:
          type: double_array
          description: Bearing range of the REAR_RIGHT sector [deg].
        right:
          type: double_array
          description: Bearing range of the RIGHT sector [deg].
        front_right:
          type: double_array
          description: Bearing range of the FRONT_RIGHT sector [deg].
    pointcloud:
      roi:
        rear:
          type: double
          description: ROI extent behind base_link [m].
        front_margin:
          type: double
          description: ROI extent ahead of base_link added to velocity times horizon [m].
        lateral:
          type: double
          description: ROI half width [m].
        z_margin_low:
          type: double
          description: Margin added to the vehicle min height offset (ground) for the ROI lower height bound [m].
        z_margin_high:
          type: double
          description: Margin added to the vehicle max height offset (vehicle height) for the ROI upper height bound [m].
      max_points:
        type: int
        description: Points inside the ROI are subsampled down to this count before clustering.
      voxel_size:
        type: double
        description: Voxel grid leaf size [m].
      cluster_tolerance:
        type: double
        description: Euclidean clustering distance tolerance [m].
      min_cluster_size:
        type: int
        description: Minimum sum of the raw (before voxel grid) point counts of the voxels in a cluster.
      max_stamp_gap_s:
        type: double
        description: Maximum time difference between the pointcloud stamp and the odometry used to place it [s].
      object_margin:
        front:
          type: double
          description: Margin added ahead of an object (object frame) when removing duplicated clusters [m].
        rear:
          type: double
          description: Margin added behind an object (object frame) when removing duplicated clusters [m].
        left:
          type: double
          description: Margin added to the left of an object (object frame) when removing duplicated clusters [m].
        right:
          type: double
          description: Margin added to the right of an object (object frame) when removing duplicated clusters [m].
    debug:
      publish_markers:
        type: bool
        description: If true, publish hazard debug markers.
      csv_path:
        type: string
        description: If not empty, append one line per cycle to this CSV file.

  latency_validator:
    nominal_latency:
      type: double
      description: Threshold of the control latency [s].

  lateral_jerk_validator:
    lateral_jerk:
      type: double
      description: Invalid threshold of the lateral jerk for steering rate validation [m/s^3].

  overrun_validator:
    assumed_delay_time:
      type: double
      description: Assumed delay for over run estimation [s].
    assumed_limit_acc:
      type: double
      description: Assumed acceleration for over run estimation [m/s^2].
    overrun_stop_point_dist:
      type: double
      description: Threshold distance to overrun stop point [m].
    will_overrun_stop_point_dist:
      type: double
      description: Threshold distance to predict overrun of the stop point [m].

  trajectory_validator:
    max_distance_deviation:
      type: double
      description: Invalid threshold of the max distance deviation between the predicted path and the reference trajectory [m].

  velocity_validator: # previously over_velocity
    hold_velocity_error_until_stop:
      type: bool
      description: If true, a velocity error is held until the vehicle stops.
    over_velocity_offset:
      type: double
      description: Threshold velocity offset to validate the vehicle velocity [m/s].
    over_velocity_ratio:
      type: double
      description: Threshold ratio to validate the vehicle velocity.
    rolling_back_velocity:
      type: double
      description: Threshold velocity to validate the vehicle velocity [m/s].
    vel_lpf_gain:
      type: double
      description: Low-pass filter gain for filtering vehicle and target velocity in the over velocity check.

  yaw_validator:
    yaw_deviation_error:
      type: double
      description: Threshold angle to validate the vehicle yaw relative to the nearest trajectory yaw [rad].
    yaw_deviation_warn:
      type: double
      description: Threshold angle to trigger a WARN diagnostic for the vehicle yaw [rad].
