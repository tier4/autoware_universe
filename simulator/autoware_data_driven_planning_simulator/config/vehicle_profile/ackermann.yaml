name: ackermann_default
vehicle_pattern: ackermann
command_type: ackermann
topics:
  state: /localization/kinematic_state
  command: /control/command/control_cmd
  initialpose: /initialpose3d
frames:
  origin: odom
  base: base_link
state_schema: [x, y, yaw, vx, vy, wz, steer]
command_schema: [velocity, acceleration, steer]
required_maneuvers:
