        braking_distance_scale_factor:
          type: double
          default_value: 1.5
          description: Scale factor for braking distance when cropping the pointcloud.
          read_only: false
        lateral_margin:
          type: double
          default_value: 2.0
          description: Lateral margin used to mask the pointcloud (m).
          read_only: false
        height_margin:
          type: double
          default_value: 1.0
          description: Height margin used to mask the pointcloud (m).
