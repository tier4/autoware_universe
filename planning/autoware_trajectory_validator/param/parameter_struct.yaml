validator:
  filter_names:
    type: string_array
    default_value: [""]
    description: metrics.
    read_only: true

  shadow_mode_filter_names:
    type: string_array
    default_value: [""]
    description: List of filter names that run in which results are logged but do not affect trajectory feasibility.
    read_only: false

  trajectory_feasibility:
    max_speed:
      type: double
      default_value: 16.7
      description: Maximum allowed speed (m/s)
      read_only: false
    max_acceleration:
      type: double
      default_value: 5.0
      description: Maximum allowed acceleration (m/s^2)
      read_only: false
    max_deceleration:
      type: double
      default_value: 5.0
      description: Maximum allowed deceleration (m/s^2, positive but represents deceleration)
      read_only: false
    max_yaw_deviation:
      type: double
      default_value: 0.35
      description: Maximum allowed absolute yaw deviation from the ego pose (rad)
    max_velocity_deviation:
      type: double
      default_value: 100.0
      description: Maximum allowed absolute velocity deviation from the ego speed (m/s)
    max_lateral_acceleration:
      type: double
      default_value: 9.8
      description: Maximum allowed absolute lateral acceleration (m/s^2)
    max_distance_deviation:
      type: double
      default_value: 100.0
      description: Maximum allowed absolute lateral distance deviation from the ego pose (m)
      read_only: false
    max_steering_angle:
      type: double
      default_value: 0.8
      description: Maximum allowed steering angle (rad)
      read_only: false
    max_steering_rate:
      type: double
      default_value: 0.3
      description: Maximum allowed steering rate (rad/s)
      read_only: false

  collision_check:
    global_setting:
      time_resolution:
        type: double
        default_value: .NAN
        description: sampling interval used in collision check trajectory generation
        read_only: false
    drac:
      stop_tracking:
        ego:
          stopped_velocity_threshold:
            type: double
            default_value: .NAN
            description: planar speed below which the ego vehicle is considered stopped (m/s)
            read_only: false
          history_timeout:
            type: double
            default_value: .NAN
            description: maximum observation gap retained in the ego stop history (s)
            read_only: false
        object:
          stopped_velocity_threshold:
            type: double
            default_value: .NAN
            description: planar speed below which an object is considered stopped (m/s)
            read_only: false
          history_timeout:
            type: double
            default_value: .NAN
            description: time after the last observation before an object stop record is removed (s)
            read_only: false
      enable_assessment:
        base:
          &drac_ea_base {
            type: string_array,
            default_value: [bbox],
            description: 'DRAC target Shape types per class. Supported values are bbox and polygon. Use [""] to disable the class.',
            read_only: false,
          }
        unknown: &drac_ea
          type: string_array
          default_value: []
          description: DRAC target Shape types per class. Supported values are bbox and polygon. Use [""] to disable the class.
          read_only: false
        car: *drac_ea
        truck: *drac_ea
        bus: *drac_ea
        trailer: *drac_ea
        motorcycle: *drac_ea
        bicycle: *drac_ea
        pedestrian: *drac_ea
        animal: *drac_ea
        hazard: *drac_ea
        over_drivable: *drac_ea
        under_drivable: *drac_ea
      pet_margin:
        ego_earlier:
          type: double
          default_value: .NAN
          description: PET margin when ego reaches the collision point earlier than the object
          read_only: false
        object_earlier:
          type: double
          default_value: .NAN
          description: PET margin when the object reaches the collision point earlier than ego
          read_only: false
      ego_footprint_margin:
        lateral:
          base:
            type: double
            default_value: .NAN
            description: default lateral margin added to both sides of the ego footprint for DRAC assessment
            read_only: false
          unknown:
            &drac_labeled_double_override {
              type: double,
              default_value: .NAN,
              description: Per-class override. NaN uses the base value.,
              read_only: false,
            }
          car: *drac_labeled_double_override
          truck: *drac_labeled_double_override
          bus: *drac_labeled_double_override
          trailer: *drac_labeled_double_override
          motorcycle: *drac_labeled_double_override
          bicycle: *drac_labeled_double_override
          pedestrian: *drac_labeled_double_override
          animal: *drac_labeled_double_override
          hazard: *drac_labeled_double_override
          over_drivable: *drac_labeled_double_override
          under_drivable: *drac_labeled_double_override
        front:
          type: double
          default_value: .NAN
          description: front margin added to the ego footprint for DRAC assessment
          read_only: false
        rear:
          type: double
          default_value: .NAN
          description: rear margin added to the ego footprint for DRAC assessment
          read_only: false
      ego_reaction_braking_delay:
        nominal:
          type: double
          default_value: .NAN
          description: Ego reaction and braking delay used for nominal DRAC assessment
          read_only: false
        departure:
          type: double
          default_value: .NAN
          description: Ego reaction and braking delay used for departure DRAC assessment
          read_only: false
      constant_curvature:
        enable_assessment:
          type: bool
          default_value: true
          description: Use constant curvature trajectories for DRAC assessment
          read_only: false
        object_time_horizon:
          base:
            type: double
            default_value: .NAN
            description: Default time horizon for the object constant curvature trajectory
            read_only: false
          unknown: *drac_labeled_double_override
          car: *drac_labeled_double_override
          truck: *drac_labeled_double_override
          bus: *drac_labeled_double_override
          trailer: *drac_labeled_double_override
          motorcycle: *drac_labeled_double_override
          bicycle: *drac_labeled_double_override
          pedestrian: *drac_labeled_double_override
          animal: *drac_labeled_double_override
          hazard: *drac_labeled_double_override
          over_drivable: *drac_labeled_double_override
          under_drivable: *drac_labeled_double_override
        ego_earlier:
          &drac_assessment {
            enable_assessment:
              {
                type: bool,
                default_value: true,
                description: Enable this DRAC assessment condition,
                read_only: false,
              },
            ego_drac_acceleration:
              {
                safe_limit:
                  {
                    type: double,
                    default_value: .NAN,
                    description: Ego acceleration limit for a safe DRAC assessment,
                    read_only: false,
                  },
                danger_limit:
                  {
                    type: double,
                    default_value: .NAN,
                    description: Ego acceleration limit for a dangerous DRAC assessment,
                    read_only: false,
                  },
                fatal_limit:
                  {
                    type: double,
                    default_value: .NAN,
                    description: Ego acceleration limit for a fatal DRAC assessment,
                    read_only: false,
                  },
                enable_abandon:
                  {
                    type: bool,
                    default_value: false,
                    description: Treat an unavoidable collision as high caution instead of fatal,
                    read_only: false,
                  },
              },
          }
        object_earlier: *drac_assessment
      map_based:
        enable_assessment:
          type: bool
          default_value: false
          description: Use map based predicted path trajectories for DRAC assessment
          read_only: false
        mutual_yield_timeout_arbitration:
          enabled:
            base:
              &drac_labeled_mutual_yield_enabled {
                type: bool,
                default_value: false,
                description: Enable mutual-yield arbitration for this object class,
                read_only: false,
              }
            unknown: *drac_labeled_mutual_yield_enabled
            car: *drac_labeled_mutual_yield_enabled
            truck: *drac_labeled_mutual_yield_enabled
            bus: *drac_labeled_mutual_yield_enabled
            trailer: *drac_labeled_mutual_yield_enabled
            motorcycle: *drac_labeled_mutual_yield_enabled
            bicycle: *drac_labeled_mutual_yield_enabled
            pedestrian: *drac_labeled_mutual_yield_enabled
            animal: *drac_labeled_mutual_yield_enabled
            hazard: *drac_labeled_mutual_yield_enabled
            over_drivable: *drac_labeled_mutual_yield_enabled
            under_drivable: *drac_labeled_mutual_yield_enabled
          min_wait_time:
            type: double
            default_value: .NAN
            description: Minimum wait time before resolving a mutual-yield deadlock (s)
            read_only: false
        ego_prioritized_ego_earlier: *drac_assessment
        ego_prioritized_object_earlier: *drac_assessment
        # Same as the shared DRAC assessment, plus the object deceleration tiers that are only
        # meaningful when the object has priority and can resolve the conflict by braking itself.
        object_prioritized_ego_earlier:
          <<: *drac_assessment
          object_drac_acceleration:
            safe_limit:
              type: double
              default_value: -0.5
              description: Required object deceleration at or milder than this is classified as safe
              read_only: false
            low_caution_limit:
              type: double
              default_value: -1.5
              description: Required object deceleration down to this is classified as low caution
              read_only: false
        object_prioritized_object_earlier: *drac_assessment
    rss:
      enable_assessment:
        base:
          &rss_ea_base {
            type: string_array,
            default_value: [bbox, polygon],
            description: 'RSS target Shape types per class. Supported values are bbox and polygon. Use [""] to disable the class.',
            read_only: false,
          }
        unknown: &rss_ea
          type: string_array
          default_value: []
          description: RSS target Shape types per class. Supported values are bbox and polygon. Use [""] to disable the class.
          read_only: false
        car: *rss_ea
        truck: *rss_ea
        bus: *rss_ea
        trailer: *rss_ea
        motorcycle: *rss_ea
        bicycle: *rss_ea
        pedestrian: *rss_ea
        animal: *rss_ea
        hazard: *rss_ea
        over_drivable: *rss_ea
        under_drivable: *rss_ea
      stop_distance_margin:
        type: double
        default_value: .NAN
        description: required remaining distance to the object when ego stops
        read_only: false
      ego_total_braking_delay:
        type: double
        default_value: .NAN
        description: Total ego braking delay for RSS calculation
        read_only: false
      ego_footprint_margin:
        lateral:
          type: double
          default_value: .NAN
          description: lateral margin added to both sides of the ego footprint for RSS assessment
          read_only: false
        front:
          type: double
          default_value: .NAN
          description: front margin added to the ego footprint for RSS assessment
          read_only: false
        rear:
          type: double
          default_value: .NAN
          description: rear margin added to the ego footprint for RSS assessment
          read_only: false
      object_assumed_acceleration:
        type: double
        default_value: .NAN
        description: Assumed object acceleration for RSS calculation (m/s^2, negative)
        read_only: false
      error_threshold:
        ego_acceleration:
          type: double
          default_value: .NAN
          description: Ego acceleration threshold to determine RSS collision (m/s^2, negative)
          read_only: false

  crosswalk:
    object_types:
      type: string_array
      default_value: [pedestrian, bicycle]
      description: object types to consider as target object
      read_only: false
    lon_detection_margin:
      type: double
      default_value: 2.0
      description: longitudinal extrusion length of sidewalk-side from crosswalk edge (m)
      read_only: false
    lat_detection_margin:
      type: double
      default_value: 1.0
      description: lateral extrusion length of sidewalk-side from crosswalk edge (m)
      read_only: false
    object_clear_time_th:
      type: double
      default_value: 0.3
      description: duration threshold to clear target object when no longer seen
      read_only: false
    distance_hysteresis_th:
      type: double
      default_value: 0.3
      description: hysteresis threshold to consider the object as the same object
      read_only: false
    overshoot_tolerance:
      type: double
      default_value: 0.1
      description: maximum overshoot distance allowed to consider the trajectory feasible (m)
      read_only: false
    nominal_deceleration:
      type: double
      default_value: 1.0
      description: nominal deceleration to calculate the stop distance used as trajectory length limit (m/s^2)
      read_only: false
    nominal_jerk:
      type: double
      default_value: 1.0
      description: nominal jerk to calculate the stop distance used as trajectory length limit (m/s^3)
      read_only: false
    stop_duration:
      type: double
      default_value: 3.0
      description: minimum duration of the stop to consider the trajectory feasible (s)
      read_only: false
    arrived_distance_threshold:
      type: double
      default_value: 5.0
      description: threshold to check if the ego vehicle has arrived at crosswalk stop line (m)
      read_only: false
    use_trajectory_time:
      type: bool
      default_value: false
      description: whether to use the embedded trajectory time to evaluate the stop duration
      read_only: false

  traffic_light:
    deceleration_limit:
      type: double
      default_value: 2.8
      description: trajectories crossing an amber light are rejected if ego can stop at the stop line without breaking this limit
      read_only: false
    jerk_limit:
      type: double
      default_value: 5.0
      description: trajectories crossing an amber light are rejected if ego can stop at the stop line without breaking this limit
      read_only: false
    delay_response_time:
      type: double
      default_value: 0.5
      description: delay response time used to estimate the minimum ego stopping distance
      read_only: false
    crossing_time_limit:
      type: double
      default_value: 2.75
      description: trajectories crossing an amber light are rejected if they cannot cross before this time
      read_only: false
    treat_amber_light_as_red_light:
      type: bool
      default_value: true
      description: when true, amber lights are handled like red lights
      read_only: false
    treat_unknown_light_as_red_light:
      type: bool
      default_value: false
      description: when true, unknown lights are handled like red lights
      read_only: false
    stop_overshoot_margin:
      type: double
      default_value: 0.5
      description: Maximum distance between the stop line and the trajectory stop point to consider the trajectory feasible (m)
      read_only: false
    allow_if_cannot_stop_distance:
      type: double
      default_value: 0.0
      description: allow crossing a stop line within this distance if ego cannot stop before the line plus its margin (m)
      validation:
        bounds<>: [0.0, 100.0]
      read_only: false
    min_lookahead_distance:
      type: double
      default_value: 20.0
      description: Minimum forward trajectory length to scan for traffic light stop lines even at low ego speed (m)
      validation:
        bounds<>: [0.0, 300.0]
      read_only: false
    stable_duration_threshold_red:
      type: double
      default_value: 0.0
      description: Stability duration for RED signals (seconds)
      read_only: false
    stable_duration_threshold_amber:
      type: double
      default_value: 0.0
      description: Stability duration for AMBER signals (seconds)
      read_only: false
    stable_duration_threshold_unknown:
      type: double
      default_value: 0.0
      description: Minimum duration an UNKNOWN signal must be seen before it is considered active (seconds)
      read_only: false
    amber_rejection_hysteresis_duration:
      type: double
      default_value: 0.0
      description: Hysteresis duration to persist an AMBER rejection (seconds)
      read_only: false
    ego_stopped_velocity_threshold:
      type: double
      default_value: 0.01
      description: Velocity below which ego is considered fully stopped (m/s)
      read_only: false
    checked_trajectory_length:
      deceleration_limit:
        type: double
        default_value: 2.0
        description: deceleration limit to calculate the stop distance used as trajectory length limit
        read_only: false
      jerk_limit:
        type: double
        default_value: 2.0
        description: jerk limit to calculate the stop distance used as trajectory length limit
        read_only: false

  boundary_departure:
    lateral_margin_m:
      type: double
      default_value: 0.01
      description: lateral margin [m]
      read_only: false
    longitudinal_margin_m:
      type: double
      default_value: 1.0
      description: longitudinal margin [m]
      read_only: false
    max_deceleration_mps2:
      type: double
      default_value: -4.0
      description: maximum deceleration [m/s^2]
      read_only: false
    max_jerk_mps3:
      type: double
      default_value: -5.0
      description: maximum jerk [m/s^3]
      read_only: false
    brake_delay_s:
      type: double
      default_value: 1.0
      description: brake delay [s]
      read_only: false
    time_to_departure_cutoff_s:
      type: double
      default_value: 2.0
      description: time to departure cutoff [s]
      read_only: false
    on_time_buffer_s:
      type: double
      default_value: 0.15
      description: buffer for activating departure detection [s]
      read_only: false
    off_time_buffer_s:
      type: double
      default_value: 0.15
      description: buffer for deactivating departure detection [s]
      read_only: false
    enable_developer_marker:
      type: bool
      default_value: true
      description: flag marker only for developer
      read_only: false
    boundary_types:
      type: string_array
      default_value: [road_border]
      description: boundary types to detect
      read_only: true

  pseudo_emergency_stop:
    enable:
      type: bool
      default_value: false
      description: When true, the emergency-stop fallback is active. When false, all emergency-stop handling is skipped. Evaluation use only.
      read_only: false
    deceleration_mps2:
      type: double
      default_value: -6.0
      description: Target longitudinal deceleration (m/s^2, negative) used to build the emergency-stop velocity profile. Evaluation use only.
      read_only: false
    jerk_mps3:
      type: double
      default_value: -20.0
      description: Longitudinal jerk (m/s^3, negative) used to ramp the deceleration when building the emergency-stop velocity profile. Evaluation use only.
      read_only: false
    recovery_policy:
      type: string
      default_value: until_stopped
      description: Recovery policy after the emergency-stop is triggered. until_stopped keeps decelerating until the ego velocity falls below recovery_velocity_threshold_mps. immediate releases the deceleration as soon as the trigger condition disappears. Evaluation use only.
      read_only: false
    recovery_velocity_threshold_mps:
      type: double
      default_value: 0.1
      description: Ego velocity threshold (m/s) under which the latched emergency-stop state is released when recovery_policy is until_stopped. Evaluation use only.
      read_only: false

  point_cloud_collision_check:
    common:
      max_accel:
        type: double
        default_value: 1.0
        description: Max acceleration used for ego braking distance estimation (m/s^2). Keep in sync with common.param.yaml normal.max_acc.
        read_only: false
      min_accel:
        type: double
        default_value: -1.0
        description: Min acceleration (deceleration) used for stopping distance (m/s^2, negative). Keep in sync with common.param.yaml normal.min_acc.
        read_only: false
      max_jerk:
        type: double
        default_value: 0.6
        description: Max jerk used for ego braking distance estimation (m/s^3). Keep in sync with common.param.yaml normal.max_jerk.
        read_only: false
      min_jerk:
        type: double
        default_value: -0.6
        description: Min jerk used for ego braking distance estimation (m/s^3, negative). Keep in sync with common.param.yaml normal.min_jerk.
        read_only: false
    stop_planning:
      stop_margin:
        type: double
        default_value: 5.0
        description: Longitudinal stop margin in front of the obstacle (m).
        read_only: false
      rss_params:
        use_rss_stop:
          type: bool
          default_value: true
          description: If true, use the obstacle braking distance for RSS-style stops.
          read_only: false
        two_wheel_objects_deceleration:
          type: double
          default_value: -3.0
          description: Assumed deceleration for BICYCLE and MOTORCYCLE (m/s^2, negative). Unused while only pointcloud obstacles are handled; kept to match the porting source.
          read_only: false
        vehicle_objects_deceleration:
          type: double
          default_value: -1.2
          description: Assumed deceleration for CAR, TRUCK and other vehicles (m/s^2, negative). Unused while only pointcloud obstacles are handled; kept to match the porting source.
          read_only: false
        no_wheel_objects_deceleration:
          type: double
          default_value: -10.0
          description: Assumed deceleration for PEDESTRIAN and UNKNOWN (m/s^2, negative). Unused while only pointcloud obstacles are handled; kept to match the porting source.
          read_only: false
        pointcloud_deceleration:
          type: double
          default_value: -1.0
          description: Assumed deceleration for a pointcloud obstacle (m/s^2, negative).
          read_only: false
        velocity_offset:
          type: double
          default_value: -1.0
          description: Velocity offset applied when computing the braking distance (m/s).
          read_only: false
      obstacle_velocity_threshold_enter_fixed_stop:
        type: double
        default_value: 3.0
        description: Velocity threshold below which a fixed stop is used (m/s).
        read_only: false
    obstacle_filtering:
      check_inside:
        type: bool
        default_value: true
        description: If true, detect obstacles inside the ego footprint corridor.
        read_only: false
      trim_trajectory:
        enable_trimming:
          type: bool
          default_value: true
          description: If true, trim the detection trajectory by ego braking distance.
          read_only: false
        min_trajectory_length:
          type: double
          default_value: 30.0
          description: Minimum trimmed trajectory length (m).
          read_only: false
        braking_distance_scale_factor:
          type: double
          default_value: 1.5
          description: Scale factor applied to braking distance for trimming.
          read_only: false
      lateral_margin:
        nominal_margin:
          type: double
          default_value: 0.3
          description: Nominal lateral margin added to the ego footprint (m).
          read_only: false
        additional_wheel_off_track_scale:
          type: double
          default_value: 0.0
          description: Scale factor for additional margin against ego wheel off-track.
          read_only: false
        is_moving_threshold_velocity:
          type: double
          default_value: 0.5
          description: Velocity threshold to regard an obstacle as moving (m/s).
          read_only: false
        additional_is_stop_margin:
          type: double
          default_value: 0.0
          description: Additional lateral margin for a stopped obstacle (m).
          read_only: false
        additional_is_moving_margin:
          type: double
          default_value: 0.0
          description: Additional lateral margin for a moving obstacle (m).
          read_only: false
      stop_obstacle_hold_time_threshold:
        type: double
        default_value: 1.0
        description: Time (s) to hold a tracked pointcloud stop candidate before purging.
        read_only: false
      excluded_class_ids:
        type: int_array
        default_value: [0, 1, 2, 3, 4, 24, 25]
        description: class_id values treated as ground/background and excluded (used only when the input pointcloud carries a class_id field). ptv3 indices - drivable_surface/other_flat_surface/sidewalk/manmade/vegetation/other_stuff/noise.
        read_only: false
    pointcloud_segmentation:
      time_series_association:
        max_time_diff:
          type: double
          default_value: 0.35
          description: Max time difference for cross-frame obstacle association (s).
          read_only: false
        min_velocity:
          type: double
          default_value: -5.0
          description: Lower velocity bound for the association gate (m/s, allows reversing).
          read_only: false
        max_velocity:
          type: double
          default_value: 30.0
          description: Upper velocity bound for the association gate (m/s).
          read_only: false
        position_diff:
          type: double
          default_value: 1.0
          description: Position difference tolerance for association (m).
          read_only: false
      velocity_estimation:
        use_estimated_velocity:
          type: bool
          default_value: false
          description: If true, use the estimated obstacle velocity in the stop decision.
          read_only: false
        min_clamp_velocity:
          type: double
          default_value: 0.0
          description: Lower clamp on the projected longitudinal velocity (m/s).
          read_only: false
        max_clamp_velocity:
          type: double
          default_value: 20.0
          description: Upper clamp on the projected longitudinal velocity (m/s).
          read_only: false
        required_velocity_count:
          type: int
          default_value: 5
          description: Number of observations required before the velocity LPF settles.
          read_only: false
        lpf_gain:
          type: double
          default_value: 0.9
          description: Low-pass filter gain for the velocity estimate.
          read_only: false
      height_margin:
        margin_from_bottom:
          type: double
          default_value: 0.5
          description: Height margin below the trajectory for collision detection (m).
          read_only: false
        margin_from_top:
          type: double
          default_value: 0.5
          description: Height margin above the ego vehicle for collision detection (m).
          read_only: false
    trajectory_polygon:
      decimate_trajectory_step_length:
        type: double
        default_value: 2.0
        description: Step length used when decimating trajectory points (m).
        read_only: false
      goal_extended_trajectory_length:
        type: double
        default_value: 6.0
        description: Length by which the trajectory end is extended when decimating (m).
        read_only: false
      enable_to_consider_current_pose:
        type: bool
        default_value: true
        description: If true, consider the current ego pose when building one-step polygons.
        read_only: false
