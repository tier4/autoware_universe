      ego_nearest_dist_threshold:
        type: double
        default_value: 3.0
        description: Distance threshold for nearest trajectory point search (m).
        read_only: false
      ego_nearest_yaw_threshold:
        type: double
        default_value: 1.046
        description: Yaw threshold for nearest trajectory point search (rad).
        read_only: false
    pointcloud_preprocessing:
