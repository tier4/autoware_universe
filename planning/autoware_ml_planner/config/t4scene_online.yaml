mode: window
validate_scene: false
grid: {interval_ns: 100000000, history_steps: 36, future_steps: 0}
frames: {scene: map, body: base_link}
# Topic remappings are controlled by the node's existing launch arguments.
inputs:
  odometry: /localization/kinematic_state
  steering: /vehicle/status/steering_status
  indicator: /vehicle/status/turn_indicators_status
  annotations: /perception/object_recognition/tracking/objects
  traffic_lights: /perception/traffic_light_recognition/traffic_signals
  route: /planning/mission_planning/route
  acceleration: /localization/acceleration
observations: {visibility: decision_snapshot, timestamp_order: received_monotonic}
resampling:
  odometry: {method: interpolate_or_hold_previous, max_delta_ns: 200000000}
  steering: {method: interpolate_or_hold_previous, max_delta_ns: 200000000}
  indicator: {method: previous, max_age_ns: 200000000}
  annotations: {method: previous, max_age_ns: 200000000}
  # The ML-Planner's traffic-light timeout applies to each observation's original stamp.
  traffic_lights: {method: previous}
  route: {method: previous}
  acceleration:
    method: interpolate_or_hold_previous
    max_delta_ns: 200000000
    options: {axes: body}
