/**:
  ros__parameters:
    time_sequence_raw_optimizer:
      weight_longitudinal: 0.5
      weight_lateral: 0.5
      weight_yaw: 0.05
      weight_jerk: 0.1
      weight_steering_rate: 10.0
      terminal_weight_scale: 2.5
      # Latch an extra terminal penalty once the predicted endpoint is within snap_distance_m
      # of the route goal. Weights are added on the terminal cost only.
      goal:
        weight_longitudinal: 5.0
        weight_lateral: 5.0
        weight_yaw: 0.5
        weight_velocity: 0.1
        snap_distance_m: 1.0
        # Drop the latch when ego-to-goal exceeds
        # unlatch_horizon_s * max(|v|, unlatch_min_speed_mps).
        # Far-away unlatch does not clear the previous-plan buffer; a new route goal does.
        unlatch_horizon_s: 8.0
        unlatch_min_speed_mps: 3.0
      # Previous plan resampled by timestamp like ml_planner. Skipped on
      # road-border shift or goal-snap latch mismatch.
      temporal_consistency:
        enable: true
        weight_longitudinal: 0.004
        weight_lateral: 0.2
        weight_yaw: 0.002
        weight_velocity: 0.004
        decay_time_constant_s: 1.0
        far_weight_ratio: 0.5
      min_velocity_mps: 0.0
      max_velocity_mps: 30.0
      min_acceleration_mps2: -4.0
      max_acceleration_mps2: 3.0
      min_jerk_mps3: -5.0
      max_jerk_mps3: 5.0
      max_steering_rate_rps: 1.0
      max_lateral_acceleration_mps2: 3.0
      max_sqp_iterations: 50
      publish_debug_topics: true
      use_stamped_ego_state: true
      ego_state_buffer_duration_s: 1.0
      max_ego_stamp_mismatch_s: 0.15
      stopped_velocity_threshold_mps: 0.15
      stopped_trajectory_max_length_m: 1.5
      goal_steer_zero_enable: true
      goal_steer_zero_distance_m: 5.0
      goal_steer_zero_requires_stopped: true

    road_border_avoidance:
      enable: false
      footprint_margin_m: 0.2
      search_radius_m: 120.0
      shift_step_m: 0.1  # path-normal offset sample resolution [m]
      max_lateral_shift_m: 1.5
      propagate_shift: true
