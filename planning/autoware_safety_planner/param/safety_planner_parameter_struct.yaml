safety_planner:
  planning_frequency_hz:
    type: double
    default_value: 10.0
    read_only: true
    description: planning frequency [Hz]
    validation:
      bounds<>: [0.0001, 50.0]

  ego_nearest_lanelet:
    dist_threshold_m:
      type: double
      default_value: 3.0
      read_only: true
      description: "[m] soft distance threshold for following the route lanelets"
      validation:
        gt<>: [0.0]
    yaw_threshold_rad:
      type: double
      default_value: 1.046
      read_only: true
      description: "[rad] soft heading threshold for following the route lanelets"
      validation:
        gt<>: [0.0]

  reference_path:
    policy:
      type: string
      default_value: simple
      read_only: true
      description: >
        How the reference_path is built. simple = the centerline of the map, cut at the goal.
        goal_connection = the centerline around the goal is dropped and replaced by a cubic spline
        into the goal. goal_connection_and_smooth = goal_connection followed by an elastic band QP
        over the whole path
      validation:
        one_of<>: [[simple, goal_connection, goal_connection_and_smooth]]
    goal_connection:
      search_radius_m:
        type: double
        default_value: 12.0
        read_only: true
        description: "[m] centerline points within this distance of the goal are dropped and replaced by the connection to it; when the new stretch leaves the lane, the radius shrinks by 1 m and it is retried"
        validation:
          gt_eq<>: [0.0]
    smoother:
      clearance_m:
        type: double
        default_value: 1.0
        read_only: true
        description: "[m] how far the smoothing may move a point from its original position; the points around the ego and the last two before the goal are held fixed"
        validation:
          gt_eq<>: [0.0]
    forward_length_m:
      type: double
      default_value: 200.0
      read_only: true
      description: reference path forward length from ego [m]
      validation:
        gt<>: [0.0]
    backward_length_m:
      type: double
      default_value: 5.0
      read_only: true
      description: reference path backward length from ego [m]
      validation:
        gt_eq<>: [0.0]

  engage_velocity:
    enable:
      type: bool
      default_value: true
      read_only: true
    velocity_hard_mps:
      type: double
      default_value: 0.3
      read_only: true
      description: "[m/s] lower bound put on the velocity of the launch section, so that the longitudinal controller leaves STOPPED when starting from standstill; the same idea as the engage_velocity of velocity_smoother. 0 disables it"

  constraint_generator_plugins:
    type: string_array
    default_value:
      - autoware::safety_planner::VehicleKinematicsConstraintGenerator
      - autoware::safety_planner::LaneFollowingDrivableAreaConstraintGenerator
      - autoware::safety_planner::ObstacleStopConstraintGenerator
    read_only: true
    description: fully qualified class names of the constraint generator plugins to load

  trajectory_planner_plugin:
    type: string
    default_value: autoware::safety_planner::RoughOptimizerTrajectoryPlanner
    read_only: true
    description: fully qualified class name of the trajectory planner plugin to load (RoughOptimizerTrajectoryPlanner = DP plus optimization, FrenetSamplingBasedPlanner = Frenet sampling). It turns the two constraint sets into two trajectories

  trajectory_optimizer:
    plugin:
      type: string
      default_value: autoware::safety_planner::NlpTrajectoryOptimizer
      read_only: true
      description: fully qualified class name of the trajectory optimizer plugin to load (NlpTrajectoryOptimizer = non-convex NLP, SscQpTrajectoryOptimizer = convex QP)
    nlp:
      cube_duration_s:
        type: double
        default_value: 1.0
        read_only: true
        description: "[s] duration of one cube of the corridor, which is carved by the same code as SSC"
        validation:
          gt<>: [0.0]
      margin_m:
        type: double
        default_value: 0.1
        read_only: true
        description: "[m] safety margin used while carving the cubes, folded into the offset of the geometry planes"
        validation:
          gt_eq<>: [0.0]
      inflation_step_m:
        type: double
        default_value: 0.2
        read_only: true
        description: "[m] one step of the cube inflation"
        validation:
          gt<>: [0.0]
      max_lateral_inflation_m:
        type: double
        default_value: 4.0
        read_only: true
        description: "[m] how far a face may inflate laterally from the seed"
        validation:
          gt<>: [0.0]
      max_longitudinal_inflation_m:
        type: double
        default_value: 20.0
        read_only: true
        description: "[m] how far a face may inflate longitudinally from the seed"
        validation:
          gt<>: [0.0]
      curvature_rate_max:
        type: double
        default_value: 0.6
        read_only: true
        description: "[1/(m s)] hard bound on the rate of curvature |w|. No constraint plugin emits one, so it lives here"
        validation:
          gt<>: [0.0]
      goal_capture_distance_m:
        type: double
        default_value: 5.0
        read_only: true
        description: "[m] within this distance the end of the tracking reference is replaced by the goal itself: once the end of the rough plan is that close, the reference of the trailing standstill becomes the goal. 0 disables the replacement"
        validation:
          gt_eq<>: [0.0]
      weight_pos:
        type: double
        default_value: 1.0
        read_only: true
        description: weight on tracking the position of the rough plan
        validation:
          gt_eq<>: [0.0]
      weight_yaw:
        type: double
        default_value: 1.0
        read_only: true
        description: weight on tracking the heading of the rough plan
        validation:
          gt_eq<>: [0.0]
      weight_v:
        type: double
        default_value: 0.5
        read_only: true
        description: weight on tracking the reference speed, which is what makes the ego move
        validation:
          gt_eq<>: [0.0]
      weight_kappa:
        type: double
        default_value: 200.0
        read_only: true
        description: weight on the squared curvature, which smooths the path
        validation:
          gt_eq<>: [0.0]
      weight_w:
        type: double
        default_value: 100.0
        read_only: true
        description: weight on the squared rate of curvature
        validation:
          gt_eq<>: [0.0]
      weight_a:
        type: double
        default_value: 0.1
        read_only: true
        description: weight on the squared acceleration
        validation:
          gt_eq<>: [0.0]
      weight_j:
        type: double
        default_value: 0.1
        read_only: true
        description: weight on the squared jerk
        validation:
          gt_eq<>: [0.0]
      weight_terminal_v:
        type: double
        default_value: 10.0
        read_only: true
        description: weight on the squared terminal speed; level 3 multiplies it by ten
        validation:
          gt_eq<>: [0.0]
      weight_terminal_a:
        type: double
        default_value: 1.0
        read_only: true
        description: weight on the squared terminal acceleration, which holds the stop
        validation:
          gt_eq<>: [0.0]
      slack_safety:
        type: double
        default_value: 1.0e+6
        read_only: true
        description: quadratic penalty on the slacks of the safety rows; no L1 penalty is used
        validation:
          gt<>: [0.0]
      slack_comfort:
        type: double
        default_value: 1.0e+4
        read_only: true
        description: quadratic penalty on the slacks of the comfort rows
        validation:
          gt<>: [0.0]
      max_iter_level1:
        type: int
        default_value: 20
        read_only: true
        description: SQP iteration budget of level 1
        validation:
          gt<>: [0]
      max_iter_level2:
        type: int
        default_value: 8
        read_only: true
        description: SQP iteration budget of level 2, with the comfort rows disabled
        validation:
          gt<>: [0]
      max_iter_level3:
        type: int
        default_value: 6
        read_only: true
        description: SQP iteration budget of level 3, with the safety rows disabled as well and a stop as the objective
        validation:
          gt<>: [0]
    ssc_qp:
      cube_duration_s:
        type: double
        default_value: 1.0
        read_only: true
        description: "[s] duration of one cube, i.e. one piece of the Bezier. A shorter one tightens the corridor and adds variables"
        validation:
          gt<>: [0.0]
      margin_m:
        type: double
        default_value: 0.1
        read_only: true
        description: "[m] safety margin added to the obstacles and the boundaries while carving the cubes"
        validation:
          gt_eq<>: [0.0]
      inflation_step_m:
        type: double
        default_value: 0.2
        read_only: true
        description: "[m] one step of the cube inflation"
        validation:
          gt<>: [0.0]
      max_lateral_inflation_m:
        type: double
        default_value: 4.0
        read_only: true
        description: "[m] how far a face may inflate laterally from the seed"
        validation:
          gt<>: [0.0]
      max_longitudinal_inflation_m:
        type: double
        default_value: 20.0
        read_only: true
        description: "[m] how far a face may inflate longitudinally from the seed"
        validation:
          gt<>: [0.0]
      lateral_rate_max_mps:
        type: double
        default_value: 2.0
        read_only: true
        description: "[m/s] bound on the Frenet lateral speed |dl/dt|, imposed through (P2) at k = 1"
        validation:
          gt<>: [0.0]
      lateral_accel_max_mps2:
        type: double
        default_value: 2.0
        read_only: true
        description: "[m/s^2] bound on the Frenet lateral acceleration |d2l/dt2|, imposed through (P2) at k = 2. It is not the lateral acceleration v^2*kappa of the vehicle"
        validation:
          gt<>: [0.0]
      weight_jerk_s:
        type: double
        default_value: 1.0
        read_only: true
        description: weight of the longitudinal squared jerk integral
        validation:
          gt_eq<>: [0.0]
      weight_jerk_l:
        type: double
        default_value: 1.0
        read_only: true
        description: weight of the lateral squared jerk integral
        validation:
          gt_eq<>: [0.0]
      regularization:
        type: double
        default_value: 1.0e-8
        read_only: true
        description: regularization added to the diagonal of P; the jerk Hessian has the polynomials of degree two and below in its null space
        validation:
          gt_eq<>: [0.0]
      osqp_eps_abs:
        type: double
        default_value: 1.0e-5
        read_only: true
        description: absolute tolerance of OSQP
        validation:
          gt<>: [0.0]

  vehicle_kinematics:
    velocity_hard_mps:
      type: double
      default_value: 16.67
      read_only: true
      description: "[m/s] hard bound on the longitudinal speed"
      validation:
        gt_eq<>: [0.0]
    lon_accel_hard_min_mps2:
      type: double
      default_value: -6.0
      read_only: true
      description: "[m/s^2] hard bound on the deceleration"
    lon_accel_hard_max_mps2:
      type: double
      default_value: 6.0
      read_only: true
      description: "[m/s^2] hard bound on the acceleration"
    lon_jerk_hard_mps3:
      type: double
      default_value: 5.0
      read_only: true
      description: "[m/s^3] hard bound on the longitudinal jerk |j|"
      validation:
        gt<>: [0.0]
    lat_accel_hard_mps2:
      type: double
      default_value: 6.0
      read_only: true
      description: "[m/s^2] hard bound on the lateral acceleration v^2|k|, about the limit of grip"
      validation:
        gt<>: [0.0]
    steer_rate_hard_radps:
      type: double
      default_value: 3.0
      read_only: true
      description: "[rad/s] hard bound on the steer rate, the limit of the actuator"
      validation:
        gt<>: [0.0]

  lane_following_drivable_area:
    margin_m:
      type: double
      default_value: 0.0
      read_only: true
      description: "[m] margin of a Boundary; its forbidden side is inflated by this much"
      validation:
        gt_eq<>: [0.0]
    bound_slack_weight:
      type: double
      default_value: 100.0
      read_only: true
      description: "[-] slack weight of the own lane bound, which is soft where a parallel lane exists; a road_border is always hard"
      validation:
        gt_eq<>: [0.0]

  obstacle_stop:
    margin_m:
      type: double
      default_value: 0.5
      read_only: true
      description: "[m] constant margin of a KeepOut; the footprint is inflated by this much"
      validation:
        gt_eq<>: [0.0]
    stop_distance_m:
      type: double
      default_value: 6.0
      read_only: true
      description: distance [m] between the stop line (Gate) and the nearest point of an object on the reference path corridor. 0 disables the stop line
      validation:
        gt_eq<>: [0.0]
    stop_line_max_object_speed_mps:
      type: double
      default_value: 1.0
      read_only: true
      description: stop lines are issued only for objects slower than this [m/s] (a moving lead vehicle is handled by the KeepOut, not by a stop line)
      validation:
        gt_eq<>: [0.0]

  simple_drivable_area:
    half_width_m:
      type: double
      default_value: 2.0
      read_only: true
      description: "[m] half width of the drivable area to each side of the reference_path"
      validation:
        gt<>: [0.0]
    forward_extension_m:
      type: double
      default_value: 5.0
      read_only: true
      description: "[m] how far the area extends beyond the end of the reference_path"
      validation:
        gt_eq<>: [0.0]
    backward_extension_m:
      type: double
      default_value: 5.0
      read_only: true
      description: "[m] how far the area extends behind the start of the reference_path"
      validation:
        gt_eq<>: [0.0]
    margin_m:
      type: double
      default_value: 0.0
      read_only: true
      description: "[m] margin of a Boundary; its forbidden side is inflated by this much"
      validation:
        gt_eq<>: [0.0]
    sample_interval_m:
      type: double
      default_value: 1.0
      read_only: true
      description: "[m] arc length between the centerline samples"
      validation:
        gt<>: [0.0]

  frenet_sampler:
    time_step_s:
      type: double
      default_value: 0.1
      read_only: true
      description: "[s] spacing of the output time grid"
      validation:
        gt<>: [0.0]
    horizon_s:
      type: double
      default_value: 10.0
      read_only: true
      description: "[s] duration of the output trajectory; a candidate whose terminal time is shorter holds its terminal state until then"
      validation:
        gt<>: [0.0]
    path_resolution_m:
      type: double
      default_value: 0.5
      read_only: true
      description: "[m] spacing at which the path l(s) is sampled; the heading and the curvature are differenced over it"
      validation:
        gt<>: [0.0]
    target_lengths_m:
      type: double_array
      default_value: [10.0, 20.0, 40.0]
      read_only: true
      description: "[m] the arc lengths over which l(s) reaches its terminal lateral position"
    target_durations_s:
      type: double_array
      default_value: [2.0, 4.0, 6.0, 8.0]
      read_only: true
      description: "[s] the terminal times of the velocity profile s(t)"
    target_lateral_positions_m:
      type: double_array
      default_value: [-2.0, -1.0, 0.0, 1.0, 2.0]
      read_only: true
      description: "[m] the terminal lateral positions to sample, measured from the reference_path and positive to the left"
    target_velocity_ratios:
      type: double_array
      default_value: [0.0, 0.25, 0.5, 0.75, 1.0]
      read_only: true
      description: "[-] the terminal speeds to sample, as ratios of the speed limit at the ego position"
    weights:
      lateral:
        type: double
        default_value: 1.0
        read_only: true
        description: "[1/(m^2 s)] weight on the squared lateral offset"
      velocity:
        type: double
        default_value: 0.5
        read_only: true
        description: "[s/m^2] weight on the squared deviation from the speed limit"
      lon_jerk:
        type: double
        default_value: 0.1
        read_only: true
        description: "[s^5/m^2] weight on the squared longitudinal jerk"
      curvature:
        type: double
        default_value: 10.0
        read_only: true
        description: "[m^2/s] weight on the squared curvature"

  rough_planner:
    time_step_s:
      type: double
      default_value: 0.1
      read_only: true
      description: "[s] spacing of the output time grid, the same as the stages of the optimizer downstream"
      validation:
        gt<>: [0.0]
    num_points:
      type: int
      default_value: 101
      read_only: true
      description: number of output points, N + 1
      validation:
        gt<>: [1]
    max_candidates:
      type: int
      default_value: 1
      read_only: true
      description: upper bound on the number of candidates; 1 for now
      validation:
        gt<>: [0]
    dp:
      s_max_m:
        type: double
        default_value: 150.0
        read_only: true
        description: "[m] how far ahead the DP grid reaches"
        validation:
          gt<>: [0.0]
      s_step_m:
        type: double
        default_value: 2.0
        read_only: true
        description: "[m] s spacing of the DP grid"
        validation:
          gt<>: [0.0]
      l_range_m:
        type: double
        default_value: 3.0
        read_only: true
        description: "[m] how far the DP grid spans to each side"
        validation:
          gt<>: [0.0]
      l_step_m:
        type: double
        default_value: 0.5
        read_only: true
        description: "[m] l spacing of the DP grid"
        validation:
          gt<>: [0.0]
      t_step_s:
        type: double
        default_value: 1.0
        read_only: true
        description: "[s] spacing of the DP layers"
        validation:
          gt<>: [0.0]
      horizon_s:
        type: double
        default_value: 10.0
        read_only: true
        description: "[s] horizon of the DP; keep it equal to the T of the optimizer downstream"
        validation:
          gt<>: [0.0]
      v_step_mps:
        type: double
        default_value: 1.0
        read_only: true
        description: "[m/s] v spacing of the DP grid"
        validation:
          gt<>: [0.0]
      lateral_slope_max:
        type: double
        default_value: 0.3
        read_only: true
        description: "[-] heading deviation dl/ds allowed from the reference"
        validation:
          gt<>: [0.0]
      lateral_rate_max_mps:
        type: double
        default_value: 1.5
        read_only: true
        description: "[m/s] upper bound on the lateral speed"
        validation:
          gt<>: [0.0]
      weights:
        progress:
          type: double
          default_value: 1.0
          read_only: true
          description: "[1/m] reward for progress, the reference unit of the cost"
        lateral:
          type: double
          default_value: 0.5
          read_only: true
          description: "[1/(m^2 s)] holding the lateral offset"
        lateral_rate:
          type: double
          default_value: 1.0
          read_only: true
          description: "[s/m^2] lateral speed, which keeps the path from zigzagging"
        velocity:
          type: double
          default_value: 0.2
          read_only: true
          description: "[s^3/m^2] deviation from the target speed"
        accel:
          type: double
          default_value: 0.1
          read_only: true
          description: "[s^5/m^2] smoothing of the acceleration"
        accel_nominal:
          type: double
          default_value: 2.0
          read_only: true
          description: "[s^5/m^2] penalty for leaving the comfortable range"
