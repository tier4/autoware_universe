/**:
  ros__parameters:
    frenet_sampling_based_planner:
      time_step_s: 0.1 # [s]
      path_resolution_m: 0.5 # [m] spacing at which the path l(s) is sampled
      target_lengths_m: [10.0, 20.0, 40.0] # [m] arc lengths over which the lateral motion completes
      target_durations_s: [2.0, 4.0, 6.0, 8.0] # [s] terminal times of the velocity profile
      target_lateral_positions_m: [-2.0, -1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0, 2.0] # [m] positive to the left
      target_velocity_ratios: [0.0, 0.25, 0.5, 0.75, 1.0] # [-] ratios of the speed limit at the ego position
      weights:
        lateral: 1.0
        velocity: 0.5
        lon_jerk: 0.1
        curvature: 10.0
