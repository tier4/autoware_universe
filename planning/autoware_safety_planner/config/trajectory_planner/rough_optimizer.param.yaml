# RoughOptimizerTrajectoryPlanner: the rough planner (a space-time DP) followed by a
# trajectory_optimizer plugin
/**:
  ros__parameters:
    trajectory_optimizer:
      # Selects the formulation of the trajectory optimization
      #   NlpTrajectoryOptimizer: a time-parameterized non-convex NLP, which carries the curvature
      #     in the state and can write the steer angle and rate as hard constraints
      #   SscQpTrajectoryOptimizer: a piecewise Bezier over (s, l, t) cubes, as a convex QP
      # The parameters of each optimizer live in <optimizer>.param.yaml in this directory
      plugin: "autoware::safety_planner::NlpTrajectoryOptimizer"

    rough_planner:
      time_step_s: 0.1 # [s] output time grid, the same as the stages of the optimizer downstream
      num_points: 101 # N + 1
      max_candidates: 1
      dp:
        s_max_m: 150.0 # [m]
        s_step_m: 0.5 # [m]
        l_range_m: 6.0 # [m]
        l_step_m: 1.0 # [m]
        t_step_s: 0.5 # [s]
        horizon_s: 10.0 # [s]
        v_step_mps: 1.0 # [m/s]
        lateral_slope_max: 0.3 # [-]
        lateral_rate_max_mps: 1.5 # [m/s]
        weights:
          progress: 1.0
          lateral: 0.5
          lateral_rate: 1.0
          velocity: 0.2
          accel: 0.1
          accel_nominal: 2.0
