/**:
  ros__parameters:
    trajectory_optimizer:
      ssc_qp:
        cube_duration_s: 1.0 # [s] duration of one cube, i.e. one piece of the Bezier
        margin_m: 0.1 # [m] safety margin used while carving the cubes
        inflation_step_m: 0.2 # [m] one step of the inflation
        max_lateral_inflation_m: 4.0 # [m]
        max_longitudinal_inflation_m: 20.0 # [m]
        lateral_rate_max_mps: 2.0 # [m/s] Frenet lateral speed |dl/dt|
        lateral_accel_max_mps2: 2.0 # [m/s^2] Frenet lateral acceleration |d2l/dt2|
        weight_jerk_s: 1.0
        weight_jerk_l: 1.0
        regularization: 1.0e-8
        osqp_eps_abs: 1.0e-5
