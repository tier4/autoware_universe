trajectory_mppi_optimizer:
  enabled:
    type: bool
    default_value: false
    description: Enable the MPPI trajectory processor plugin
    read_only: false
  shadow_mode:
    type: bool
    default_value: false
    description: Run MPPI without replacing the input trajectory
    read_only: false
  limit_velocity_from_map:
    type: bool
    default_value: false
    description: Apply the lanelet velocity limit at each input reference trajectory point
    read_only: false
  limit_velocity_from_map_debug_lanelet_ids:
    type: int_array
    default_value: []
    description: Lanelet IDs whose map velocity limits are overridden when map limiting is enabled
    read_only: false
  limit_velocity_from_map_debug_max_velocities:
    type: double_array
    default_value: []
    description: Finite non-negative debug maximum velocities in m/s aligned with the lanelet IDs
    read_only: false
  lambda:
    type: double
    default_value: 100.0
    description: Softmax temperature for rollout weights
    validation: { gt<>: [0.0] }
    read_only: false
  max_iter:
    type: int
    default_value: 20
    description: Number of optimization iterations per MPPI update
    validation: { gt<>: [0] }
    read_only: false
  speed_coeff:
    type: double
    default_value: 300.0
    description: Speed tracking cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  track_coeff:
    type: double
    default_value: 0.0
    description: Time-indexed position cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  track_terminal_scale:
    type: double
    default_value: 10.0
    description: Terminal position cost scale
    validation: { gt_eq<>: [0.0] }
    read_only: false
  heading_coeff:
    type: double
    default_value: 0.0
    description: Time-indexed heading cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  lateral_distance_coeff:
    type: double
    default_value: 4000.0
    description: Spatial lateral distance cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  lateral_yaw_error_coeff:
    type: double
    default_value: 500.0
    description: Spatial yaw error cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  remaining_distance_coeff:
    type: double
    default_value: 40.0
    description: Remaining corridor distance cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  path_overshoot_coeff:
    type: double
    default_value: 1000.0
    description: Path overshoot cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  track_center_coeff:
    type: double
    default_value: 0.0
    description: Vehicle center tracking cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  corner_buffer_coeff:
    type: double
    default_value: 0.0
    description: Vehicle corner clearance cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  corner_safe_margin:
    type: double
    default_value: 0.3
    description: Vehicle corner clearance margin in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  lateral_acceleration_coeff:
    type: double
    default_value: 100.0
    description: Lateral acceleration cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  lateral_jerk_coeff:
    type: double
    default_value: 10.0
    description: Lateral jerk cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  longitudinal_jerk_coeff:
    type: double
    default_value: 100.0
    description: Longitudinal jerk cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  accel_cmd_coeff:
    type: double
    default_value: 50.0
    description: Acceleration command cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  steer_cmd_coeff:
    type: double
    default_value: 250.0
    description: Steering command cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  steer_rate_coeff:
    type: double
    default_value: 20000.0
    description: Steering rate cost coefficient
    validation: { gt_eq<>: [0.0] }
    read_only: false
  accel_cmd_std_dev:
    type: double
    default_value: 0.1
    description: Acceleration command noise standard deviation
    validation: { gt<>: [0.0] }
    read_only: false
  steer_cmd_std_dev:
    type: double
    default_value: 0.02
    description: Steering command noise standard deviation
    validation: { gt<>: [0.0] }
    read_only: false
  std_dev_decay:
    type: double
    default_value: 0.84
    description: Per-iteration multiplier for the sampling noise standard deviation
    validation: { bounds<>: [0.0, 1.0] }
    read_only: false
  accel_cmd_noise_exponent:
    type: double
    default_value: 1.0
    description: Acceleration command noise exponent
    validation: { gt_eq<>: [0.0] }
    read_only: false
  steer_cmd_noise_exponent:
    type: double
    default_value: 1.0
    description: Steering command noise exponent
    validation: { gt_eq<>: [0.0] }
    read_only: false
  drivable_area_safe_margin:
    type: double
    default_value: 0.0
    description: Drivable area safety margin in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  drivable_area_barrier_weight:
    type: double
    default_value: 0.0
    description: Drivable area barrier cost weight
    validation: { gt_eq<>: [0.0] }
    read_only: false
  boundary_threshold:
    type: double
    default_value: 0.8
    description: Lateral boundary threshold in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  lateral_boundary_soft_margin:
    type: double
    default_value: 0.2
    description: Lateral boundary soft margin in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  obstacle_collision_margin:
    type: double
    default_value: 0.2
    description: Obstacle collision margin in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  road_border_collision_margin:
    type: double
    default_value: 0.1
    description: Road border collision margin in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  obstacle_safe_margin:
    type: double
    default_value: 0.4
    description: Obstacle safety margin in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  road_border_safe_margin:
    type: double
    default_value: 0.2
    description: Road border safety margin in meters
    validation: { gt_eq<>: [0.0] }
    read_only: false
  crash_contact_penalty:
    type: double
    default_value: 100000.0
    description: Hard contact cost penalty
    validation: { gt_eq<>: [0.0] }
    read_only: false
  nominal_curvature_min_chord_length_m:
    type: double
    default_value: 1.5
    description: Minimum chord length for nominal curvature
    validation: { gt<>: [0.0] }
    read_only: false
  enable_input_delay_compensation:
    type: bool
    default_value: true
    description: Enable actuator input delay compensation
    read_only: false
  prevent_reverse_velocity:
    type: bool
    default_value: true
    description: Prevent reverse rollout velocity
    read_only: false
  ignore_obstacles:
    type: bool
    default_value: false
    description: Ignore object costs and validation
    read_only: false
  ignore_road_borders:
    type: bool
    default_value: false
    description: Ignore road border costs and validation
    read_only: false
  ignore_drivable_area:
    type: bool
    default_value: false
    description: Ignore drivable area costs
    read_only: false
  force_cold_start_each_step:
    type: bool
    default_value: false
    description: Reset the nominal control before each step
    read_only: false
  skip_if_invalid:
    type: bool
    default_value: true
    description: Retain the input trajectory after validation failure
    read_only: false
  min_optimization_length:
    type: double
    default_value: 0.0
    description: Minimum input arc length for optimization
    validation: { gt_eq<>: [0.0] }
    read_only: false
  use_temporal_mpt_as_nominal:
    type: bool
    default_value: true
    description: Seed the nominal control with temporal MPT
    read_only: false
  use_last_control_as_nominal:
    type: bool
    default_value: true
    description: Warm-start MPPI u_nom from the previous optimized control (ignored when t-MPT seeds u_nom)
    read_only: false
  enable_debug_trajectory_log:
    type: bool
    default_value: false
    description: Enable offline trajectory log output
    read_only: false
  debug_trajectory_log_directory:
    type: string
    default_value: ""
    description: Directory for offline trajectory logs (empty = current working directory)
    read_only: false
  enable_distance_map_texture_debug:
    type: bool
    default_value: false
    description: Open a CUDA-OpenGL window visualizing the static and dynamic distance textures
    read_only: false
  enable_iteration_rollout_debug:
    type: bool
    default_value: false
    description: Capture sampled rollouts at every MPPI iteration and publish them as debug markers
    read_only: false
