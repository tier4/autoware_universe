/**:
  ros__parameters:
    # Vehicle actuation dynamics are loaded from $(vehicle_model)_description/config/simulator_model.param.yaml

    # FirstOrderDubinsBicycleCostParams (see first_order_dubins_bicycle_cost.cuh)
    lambda: 5000.0
    desired_speed: 2.5
    speed_coeff: 500.0
    track_coeff: 2000.0
    heading_coeff: 1000.0
    crash_coeff: 100000.0
    boundary_threshold: 0.8
    boundary_threshold_left: -1.0
    boundary_threshold_right: -1.0
    lateral_acceleration_coeff: 1000.0
    lateral_jerk_coeff: 3000.0
    longitudinal_jerk_coeff: 1500.0
    accel_cmd_coeff: 500.0
    steer_cmd_coeff: 1500.0
    steer_rate_coeff: 5000.0
    goal_pos_coeff: 1000.0
    goal_speed_coeff: 200.0
    goal_yaw_coeff: 500.0
    goal_terminal_scale: 10.0
    obstacle_collision_margin: 0.2
    road_border_collision_margin: 0.2
    drivable_area_crossing_coeff: 500.0

    # Optional offline debug logging for mppi_debug_visualizer.py --log-dir
    # Empty directory resolves to $XDG_CACHE_HOME/autoware/mppi_debug_log
    # (or $HOME/.cache/autoware/mppi_debug_log).
    enable_debug_trajectory_log: true
    debug_trajectory_log_directory: ""

    ignore_obstacles: false
    ignore_drivable_area: true
    force_cold_start_each_step: false
    skip_if_invalid: true  # if the MPPI output is invalid (i.e., collides with obstacles or road borders), the input reference is returned

    # Warm-start u_nom from shifted previous optimized controls (else reseed from DP each cycle).
    use_last_control_as_nominal: true

    # Reuse the previous MPPI rollout as x0 while it remains consistent with raw localization.
    enable_trajectory_stitching: true
    planning_origin_max_position_error: 0.2  # Euclidean XY divergence threshold [m]
    planning_origin_max_yaw_error: 0.15  # absolute wrapped-yaw divergence threshold [rad]
    trajectory_stitching_prefix_duration: 0.3  # time-aligned previous output prefix [s]
