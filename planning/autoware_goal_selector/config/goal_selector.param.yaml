/**:
  ros__parameters:
    goal_footprint_margin: 0.1 # [m] uniform inflation of the vehicle footprint at the goal
    traffic_signal_timeout: 2.0 # [s] a signal not updated for this long is treated as not red
    trigger_height_tolerance: 2.0 # [m] a trigger matches only goals within this height of its first candidate (negative: ignore height)

    # Goal candidates referenced by the triggers below.
    # lane_ids is the lanelet ID sequence the vehicle must follow, in travel order.
    # List road lanelets only. When the goal is on a road_shoulder, end with the road lanelet next to it.
    # Omit the key rather than writing an empty list.
    # traffic_light_group_id (optional) is the ID of the traffic signal (regulatory element) assigned
    # to the goal. The goal is not used while that signal is red.
    # Omit the key when the goal has no signal.
    # NOTE: all poses, lane_ids and traffic_light_group_id values are dummy values (0). Replace them with the real ones on the map.
    goals: ["slot_1", "slot_2", "stop_a", "stop_b", "slot_3", "slot_4"]
    slot_1:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0 # [rad]
      lane_ids: [0]
      traffic_light_group_id: 0

    slot_2:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0 # [rad]
      lane_ids: [0]
      traffic_light_group_id: 0

    stop_a:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0 # [rad]
      lane_ids: [0]

    stop_b:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0 # [rad]
      lane_ids: [0]

    slot_3:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0 # [rad]
      lane_ids: [0]

    slot_4:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0 # [rad]
      lane_ids: [0]

    # Trigger areas. The next goal is selected once the ego arrives at a route goal inside one of them.
    # fallback_goal is used when no goal candidate is available. It has to lie inside another trigger's area.
    # NOTE: the positions are dummy values (0). Replace them with the real ones on the map.
    triggers: ["station_a", "station_b"]
    station_a:
      x: 0.0
      y: 0.0
      radius: 3.0 # [m]
      goal_candidates: ["slot_1", "slot_2"] # in priority order
      fallback_goal: stop_b
    station_b:
      x: 0.0
      y: 0.0
      radius: 3.0 # [m]
      goal_candidates: ["slot_3", "slot_4"] # in priority order
      fallback_goal: stop_a
