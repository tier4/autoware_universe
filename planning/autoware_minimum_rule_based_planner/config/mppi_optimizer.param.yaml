/**:
  ros__parameters:
    mppi_optimizer:
      enabled: true
      shadow_mode: false
      limit_velocity_from_map: false
      # Aligned debug override arrays: lanelet ID -> maximum velocity [m/s].
      limit_velocity_from_map_debug_lanelet_ids: [0]
      limit_velocity_from_map_debug_max_velocities: [0.0]

      # FirstOrderDubinsBicycleCostParams (see first_order_dubins_bicycle_cost.cuh)
      lambda: 100.0
      speed_coeff: 500.0
      track_coeff: 0.0
      track_terminal_scale: 0.0
      heading_coeff: 0.0
      # Spatial (closest-segment) costs restored from pre time-indexed tracking; 0 = off.
      lateral_distance_coeff: 0.0
      lateral_yaw_error_coeff: 0.0
      # Soft cost on remaining corridor chord length to path end [m]; 0 = off.
      remaining_distance_coeff: 0.1
      # Soft cost on along-track distance past the corridor tip [m]; 0 = off.
      path_overshoot_coeff: 1.0
      # Track the center of the ego footprint against the time-indexed reference; 0 = off.
      track_center_coeff: 1.0
      # Soft clearance cost for ego corners near drivable-area boundaries; 0 = off.
      corner_buffer_coeff: 1.0
      corner_safe_margin: 0.3
      lateral_acceleration_coeff: 0.0
      lateral_jerk_coeff: 0.0
      longitudinal_jerk_coeff: 0.0
      accel_cmd_coeff: 0.0
      steer_cmd_coeff: 0.0
      steer_rate_coeff: 100.0
      # Shared deadband-quadratic cost for optional VelocityLimit bounds.
      overlimit_coeff: 1000.0
      # MPPI control-sample noise std-devs around the nominal (u_nom).
      accel_cmd_std_dev: 0.1
      steer_cmd_std_dev: 0.02
      # Power-law PSD exponents (0 = white, 1 = pink, 2 = brown) for colored noise.
      accel_cmd_noise_exponent: 2.0
      steer_cmd_noise_exponent: 2.0
      drivable_area_safe_margin: 0.0
      drivable_area_barrier_weight: 0.0
      # Crash costs
      boundary_threshold: 1.2
      lateral_boundary_soft_margin: 0.5
      obstacle_collision_margin: 0.2
      road_border_collision_margin: 0.2
      obstacle_safe_margin: 0.4
      road_border_safe_margin: 0.4
      crash_contact_penalty: 10000.0

      nominal_curvature_min_chord_length_m: 1.5

      # Delays still come from simulator_model when this is true.
      enable_input_delay_compensation: false
      prevent_reverse_velocity: true

      ignore_obstacles: true
      ignore_road_borders: false
      ignore_drivable_area: true
      force_cold_start_each_step: false
      skip_if_invalid: true
      min_optimization_length: 0.0

      # Cold-seed u_nom from acados temporal MPT.
      use_temporal_mpt_as_nominal: false
      use_last_control_as_nominal: true

      # Optional offline debug log output.
      enable_debug_trajectory_log: true
      debug_trajectory_log_directory: ""
