# /**:
#   ros__parameters:
#     # The shared MPPI defaults rely on a diffusion trajectory and disable reference tracking.
#     # The minimum rule-based planner supplies a deterministic timed reference, so MPPI must stay
#     # close to its position, heading, and speed while improving lateral feasibility.
#     lambda: 1500.0
#     speed_coeff: 500.0
#     track_coeff: 1000.0
#     track_terminal_scale: 10.0
#     heading_coeff: 500.0
#     lateral_acceleration_coeff: 300.0
#     lateral_jerk_coeff: 300.0
#     longitudinal_jerk_coeff: 10.0
#     use_temporal_mpt_as_nominal: true
#     use_last_control_as_nominal: true
#     skip_if_invalid: true
/**:
  ros__parameters:
    # Vehicle actuation dynamics are loaded from $(vehicle_model)_description/config/simulator_model.param.yaml

    # FirstOrderDubinsBicycleCostParams (see first_order_dubins_bicycle_cost.cuh)
    lambda: 100.0
    speed_coeff: 500.0
    track_coeff: 0.0
    track_terminal_scale: 0.0
    heading_coeff: 0.0
    # Spatial (closest-segment) costs restored from pre time-indexed tracking; 0 = off.
    lateral_distance_coeff: 0.0
    lateral_yaw_error_coeff: 0.0
    # Soft cost on remaining corridor chord length to path end [m]; 0 = off.
    remaining_distance_coeff: 40.0
    # Soft cost on along-track distance past the corridor tip [m]; 0 = off.
    path_overshoot_coeff: 100.0
    # Track the center of the ego footprint against the time-indexed reference; 0 = off.
    track_center_coeff: 0.0
    # Soft clearance cost for ego corners near drivable-area boundaries; 0 = off.
    corner_buffer_coeff: 0.0
    corner_safe_margin: 0.3
    lateral_acceleration_coeff: 300.0
    lateral_jerk_coeff: 300.0
    longitudinal_jerk_coeff: 10.0
    accel_cmd_coeff: 0.0
    steer_cmd_coeff: 0.0
    steer_rate_coeff: 0.0
    # MPPI control-sample noise std-devs around the nominal (u_nom).
    accel_cmd_std_dev: 0.1
    steer_cmd_std_dev: 0.02
    # Power-law PSD exponents (0 = white, 1 = pink, 2 = brown) for colored noise.
    accel_cmd_noise_exponent: 1.0
    steer_cmd_noise_exponent: 1.0
    drivable_area_safe_margin: 0.0
    drivable_area_barrier_weight: 0.0
    # Crash costs
    boundary_threshold: 1.5
    lateral_boundary_soft_margin: 0.8
    obstacle_collision_margin: 0.2
    road_border_collision_margin: 0.3
    obstacle_safe_margin: 0.2
    road_border_safe_margin: 0.2
    crash_contact_penalty: 100000.0  # cost applied when the distance from a road_border/obstacle/lateral bound is exactly 0 (including hard margin)

    nominal_curvature_min_chord_length_m: 1.5

    # When false, MPPI plant ignores acc/steer input delays (N=0). First-order lag τ still applies.
    # Delays still come from simulator_model when this is true.
    enable_input_delay_compensation: true

    # Prevent MPPI rollouts from producing reverse longitudinal velocities.
    prevent_reverse_velocity: true

    ignore_obstacles: false
    ignore_drivable_area: false
    force_cold_start_each_step: false
    skip_if_invalid: true  # if the MPPI output is invalid (i.e., collides with obstacles or road borders), the input reference is returned
    min_optimization_length: 0.0  # [m] skip MPPI optimization if the input reference trajectory is shorter than this length

    # Cold-seed u_nom from acados temporal MPT (same N=80, dt=0.1 as MPPI). Falls back to
    # geometric diffusion seed if the solve fails. Combines with use_last_control_as_nominal
    # (previous u_opt → t-MPT warm-start, then t-MPT → u_nom).
    use_temporal_mpt_as_nominal: true
    use_last_control_as_nominal: true

    # Optional offline debug logging for mppi_debug_visualizer.py --log-dir
    # Empty directory resolves to $XDG_CACHE_HOME/autoware/mppi_debug_log
    # (or $HOME/.cache/autoware/mppi_debug_log).
    enable_debug_trajectory_log: false
    debug_trajectory_log_directory: ""
