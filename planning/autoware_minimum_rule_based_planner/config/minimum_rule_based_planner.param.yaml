/**:
  ros__parameters:
    # generate_parameter_library parameters
    planning_frequency_hz: 10.0
    plugin_names:
      - "autoware::minimum_rule_based_planner::plugin::ObstacleStop"
      - "autoware::minimum_rule_based_planner::plugin::SurroundObstacleStop"

    path_planning:
      path_length:
        backward: 5.0
        forward: 300.0

      early_stop:
        expected_ego_speed_parking: 2.8
        max_lat_accel_parking: 0.8
        max_decel_parking: 1.0
        max_jerk_parking: 1.0

      lane_change_failure_stop_margin: 0.0

      ego_nearest_lanelet:
        dist_threshold: 3.0
        yaw_threshold: 1.046

      path_shift:
        enable: true
        minimum_shift_length: 0.5
        minimum_shift_yaw: 0.349 # 20 deg
        minimum_shift_distance: 5.0
        min_speed_for_curvature: 2.77  # [m/s] 10 km/h
        lateral_accel_limit: 1.0      # [m/s^2]

      waypoint_group:
        separation_threshold: 1.0
        interval_margin_ratio: 10.0

      output:
        delta_arc_length: 0.5

    map_based_stop:
      stop_margin_distance: 0.0 # [m]
      stop_distance_from_crosswalk: 3.5 # [m]
      stop_distance_from_private_area: 3.0 # [m]
      stop_distance_from_intersection: 1.0 # [m]
      max_deceleration: 4.0 # [m/s^2]
      max_jerk: 5.0 # [m/s^3]
      stop_point_diff_threshold: 0.5 # [m]

    obstacle_stop:
      enable: true
      use_objects: true
      use_pointcloud: true
      enable_stop_for_objects: true
      enable_stop_for_pointcloud: false
      stop_margin: 6.0
      nominal_stopping_decel: 1.0 # [m/s^2]
      maximum_stopping_decel: 4.0 # [m/s^2]
      stopping_jerk: 3.0 # [m/s^3]
      on_time_buffer: 0.5 # [s]
      off_time_buffer: 0.7 # [s]
      lateral_margin: 0.2     # lateral margin on top of ego width from trajectory to consider for obstacle stop [m]
      arrived_distance_threshold: 0.5 # threshold to check if the ego vehicle has arrived at the stop point [m]

      objects:
        object_types: ["car", "truck", "bus", "trailer", "motorcycle", "bicycle", "pedestrian", "hazard"] # object types to consider for obstacle stop
        stopped_velocity_th: 0.3 # velocity threshold for target object to be considered as stopped [m/s]
        max_lateral_velocity_th: 1.0 # maximum lateral velocity threshold for target object [m/s]
        safety_buffer: 0.1       # safety buffer to expand object shape [m]

      pointcloud:
        height_buffer: 0.5  # height buffer to add above ego height [m]
        min_height: 0.2  # minimum height of pointcloud [m]
        voxel_grid_filter:
          x: 0.2
          y: 0.2
          z: 0.2
          min_size: 3
        clustering:
          tolerance: 0.5  #[m]
          min_height: 0.5
          min_size: 10
          max_size: 10000

      rss_params:
        enable: true
        object_decel:
          car: 1.6
          truck: 1.6
          bus: 1.6
          trailer: 1.6
          motorcycle: 2.0
          bicycle: 3.0
          pedestrian: 5.0
        ego_decel: 2.0           # [m/s^2]
        reaction_time: 0.4       # [s]
        safety_margin: 3.0       # [m]
        lookahead_horizon: 1.5   # [s]

    surround_obstacle_stop:
      enable: true
      use_objects: true
      use_pointcloud: false
      object_types: ["car", "truck", "bus", "trailer", "motorcycle", "bicycle", "pedestrian", "hazard", "animal", "unknown"] # object types to consider for surround obstacle stop
      front_distance_th:
        car: 0.5
        truck: 0.5
        bus: 0.5
        trailer: 0.5
        motorcycle: 0.5
        bicycle: 0.5
        pedestrian: 0.5
        hazard: 0.5
        animal: 0.5
        unknown: 0.5
        pointcloud: 0.5
      side_distance_th:
        car: 0.0
        truck: 0.0
        bus: 0.0
        trailer: 0.0
        motorcycle: 1.0
        bicycle: 1.0
        pedestrian: 1.0
        hazard: 0.5
        animal: 0.5
        unknown: 0.5
        pointcloud: 0.5
      back_distance_th:
        car: 0.0
        truck: 0.0
        bus: 0.0
        trailer: 0.0
        motorcycle: 0.5
        bicycle: 0.5
        pedestrian: 0.5
        hazard: 0.5
        animal: 0.5
        unknown: 0.5
        pointcloud: 0.5
      hysteresis_distance: 0.1 # [m]
      hysteresis_time: 0.2     # [s]
      ego_stopped_vel_th: 0.1  # [m/s]

    velocity_smoother:
      nearest_dist_threshold_m: 1.5
      nearest_yaw_threshold_deg: 60.0
      target_pull_out_speed_mps: 0.25
      target_pull_out_acc_mps2: 0.5
      max_speed_mps: 13.88
      max_lateral_accel_mps2: 1.5
      set_engage_speed: true
      limit_speed: true
      limit_lateral_acceleration: false
      smooth_velocities: true
      stop_dist_to_prohibit_engage: 0.5

    # Solves shape and speed as one NLP. In shadow mode it only publishes to
    # ~/debug/optimizer/acados_mpt/trajectory; with shadow: false it replaces the eb smoother and
    # the velocity smoother above. Every other value is the library default; see the schema.
    acados_mpt:
      enable: false
      shadow: true
      limits:
        velocity:
          max: 13.88          # nominal [m/s]
          hard_max: 16.67     # rejected above this [m/s]
        acceleration:
          min: -1.0           # nominal [m/s^2]
          max: 1.0            # nominal [m/s^2]
          hard_min: -6.0      # vehicle limit [m/s^2]
          hard_max: 6.0       # vehicle limit [m/s^2]
        lateral_acceleration:
          max: 2.0            # nominal [m/s^2]
          hard_max: 6.0       # roughly the grip limit [m/s^2]
        jerk:
          max: 1.6            # nominal [m/s^3]
          hard_max: 5.0       # rejected above this [m/s^3]
        steer_rate:
          max: 0.995          # nominal [rad/s] 57 deg/s
          hard_max: 3.0       # steering actuator ceiling [rad/s]
        max_curvature: -1.0   # single tier; non-positive derives it from the vehicle steer limit
      solver:
        max_iterations: 25          # ~2.5 ms per iteration, so this bounds the worst case
        use_velocity_smoother_guess: true  # seed the speed profile with the jerk-filtered smoother
        max_arc_length: 150.0
        # Cap the reference speed by curvature, so a corner is taken by slowing down rather than by
        # widening it (the reference is what the cost pulls towards; see the library README).
        reference_speed_follows_curvature: true
        curvature_cap_window: 5.0
      corridor:
        # The corridor is not fed any map or object geometry yet, but its constraint rows are still
        # in the problem and cost solve time. true drives the solver generated without them.
        omit_constraint_rows: false

    post_resample:
      max_trajectory_length: 300.0
      min_trajectory_length: 30.0
      resample_time: 10.0
      dense_resample_dt: 0.1
      dense_min_interval_distance: 0.1
      sparse_resample_dt: 0.1
      sparse_min_interval_distance: 1.0

    debug:
      enable_path: true
      enable_shifted_trajectory: true
      enable_optimizer_trajectory: true
      enable_modifier_trajectory: true
      enable_output_trajectory: true
