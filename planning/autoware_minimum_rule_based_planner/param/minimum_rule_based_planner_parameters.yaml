minimum_rule_based_planner:
  planning_frequency_hz:
    type: double
    default_value: 10.0
    validation:
      gt<>: [0.0]
  plugin_names:
    type: string_array
    default_value:
      - autoware::minimum_rule_based_planner::plugin::ObstacleStop,
      - autoware::minimum_rule_based_planner::plugin::SurroundObstacleStop,
    description: List of plugin names to load
    read_only: false

  start_planner:
    enable:
      type: bool
      default_value: false
      description: enable pull out planning (sampled shift candidates with collision check) at departure

    ego_stopped_velocity:
      type: double
      default_value: 0.5
      validation:
        gt<>: [0.0]
      description: pull out is considered only when ego is slower than this [m/s]

    activation_lateral_offset:
      type: double
      default_value: 0.5
      validation:
        gt<>: [0.0]
      description: lateral offset from the reference path to trigger pull out [m]

    finish_lateral_offset:
      type: double
      default_value: 0.2
      validation:
        gt<>: [0.0]
      description: lateral offset below which the pull out is considered complete [m]

    minimum_lateral_accel:
      type: double
      default_value: 0.2
      validation:
        gt<>: [0.0]
      description: lateral acceleration of the gentlest (longest) shift candidate [m/s^2]

    maximum_lateral_accel:
      type: double
      default_value: 1.0
      validation:
        gt<>: [0.0]
      description: lateral acceleration of the sharpest (shortest) shift candidate [m/s^2]

    lateral_accel_sampling_num:
      type: int
      default_value: 4
      validation:
        gt<>: [0]
      description: number of sampled shift candidates

    collision_check_margins:
      type: double_array
      default_value: [2.0, 1.0, 0.5, 0.1]
      description: static object collision margins, tried from large to small [m]

    collision_check_extra_length:
      type: double
      default_value: 5.0
      validation:
        gt<>: [0.0]
      description: distance checked beyond the shift section [m]

    object_velocity_threshold:
      type: double
      default_value: 1.0
      validation:
        gt<>: [0.0]
      description: objects slower than this are treated as static obstacles [m/s]

    object_search_radius:
      type: double
      default_value: 30.0
      validation:
        gt<>: [0.0]
      description: objects farther than this from ego are ignored [m]

  goal_planner:
    enable:
      type: bool
      default_value: false
      description: enable pull over planning (sampled shift candidates with collision check) at arrival

    activation_lateral_offset:
      type: double
      default_value: 0.5
      validation:
        gt<>: [0.0]
      description: lateral offset of the goal from the path to trigger pull over [m]

    minimum_lateral_accel:
      type: double
      default_value: 0.2
      validation:
        gt<>: [0.0]
      description: lateral acceleration of the gentlest (longest) shift candidate [m/s^2]

    maximum_lateral_accel:
      type: double
      default_value: 1.0
      validation:
        gt<>: [0.0]
      description: lateral acceleration of the sharpest (shortest) shift candidate [m/s^2]

    lateral_accel_sampling_num:
      type: int
      default_value: 4
      validation:
        gt<>: [0]
      description: number of sampled shift candidates

    collision_check_margins:
      type: double_array
      default_value: [2.0, 1.0, 0.5, 0.1]
      description: static object collision margins, tried from large to small [m]

    object_velocity_threshold:
      type: double
      default_value: 1.0
      validation:
        gt<>: [0.0]
      description: objects slower than this are treated as static obstacles [m/s]

    object_search_radius:
      type: double
      default_value: 50.0
      validation:
        gt<>: [0.0]
      description: objects farther than this from the goal are ignored [m]

    turn_signal_distance:
      type: double
      default_value: 30.0
      validation:
        gt<>: [0.0]
      description: turn signal turns on when ego is within this distance of the shift start [m]

  smoothing:
    use_eb_smoother:
      type: bool
      default_value: true
      description: apply the elastic band smoother to the trajectory (geometry smoothing)

  path_planning:
    waypoint_group:
      separation_threshold:
        type: double
        default_value: 1.0
        description: maximum distance between waypoints to belong to same group [m]

      interval_margin_ratio:
        type: double
        default_value: 10.0
        description: ratio to expand interval bound of group according to lateral distance

    early_stop:
      expected_ego_speed_parking:
        type: double
        default_value: 2.8
        validation:
          gt<>: [0.0]
        description: expected ego speed during pull over to the side of the road [m/s]

      max_lat_accel_parking:
        type: double
        default_value: 0.8
        validation:
          gt<>: [0.0]
        description: expected max lateral acceleration during pull over to the side of the road [m/s^2]

      max_decel_parking:
        type: double
        default_value: 1.0
        validation:
          gt<>: [0.1]
        description: max longitudinal deceleration used to compute the stopping distance during pull over [m/s^2]

      max_jerk_parking:
        type: double
        default_value: 1.0
        validation:
          gt<>: [0.1]
        description: max longitudinal jerk used to compute the stopping distance during pull over [m/s^3]

    # Parameters for lanelet matching (different from EB smoother's ego_nearest_* params)
    ego_nearest_lanelet:
      dist_threshold:
        type: double
        default_value: 3.0
        description: distance threshold for ego nearest lanelet search [m]

      yaw_threshold:
        type: double
        default_value: 1.046
        description: yaw threshold for ego nearest lanelet search [rad]

    path_length:
      backward:
        type: double
        default_value: 5.0
        validation:
          gt<>: [0.0]

      forward:
        type: double
        default_value: 100.0
        validation:
          gt<>: [0.0]

    output:
      delta_arc_length:
        type: double
        default_value: 0.5
        description: delta arc length for output trajectory [m]
        validation:
          gt<>: [0.0]

    lane_change_failure_stop_margin:
      type: double
      default_value: 0.0
      validation:
        gt_eq<>: [0.0]

    # Path Shift to Ego Parameters
    path_shift:
      enable:
        type: bool
        default_value: true
        description: enable path shifting from ego position to centerline

      minimum_shift_length:
        type: double
        default_value: 0.1
        description: lateral offset threshold to trigger path shifting [m]

      minimum_shift_yaw:
        type: double
        default_value: 0.1
        description: yaw deviation threshold to trigger path shifting [rad]

      minimum_shift_distance:
        type: double
        default_value: 5.0
        description: floor for shift distance ahead of ego [m]

      min_speed_for_curvature:
        type: double
        default_value: 2.77
        description: lower bound on ego speed used to compute initial curvature kappa0 = yaw_rate / speed [m/s]
        validation:
          gt<>: [0.0]

      lateral_accel_limit:
        type: double
        default_value: 0.5
        description: allowed lateral acceleration budget for the shift polynomial (comfort/safety limit) [m/s^2]
        validation:
          gt<>: [0.0]

    # Trajectory Anchor Parameters (connect from the previous trajectory instead of from ego)
    trajectory_anchor:
      enable:
        type: bool
        default_value: false
        description: connect the trajectory from a pose taken behind ego on the previous cycle's trajectory instead of from the ego pose, so that the shape stays stable across cycles

      backward_distance:
        type: double
        default_value: 5.0
        description: arc length behind ego at which the anchor pose is taken on the previous trajectory (should not exceed path_length.backward by much) [m]
        validation:
          gt<>: [0.0]

      max_lateral_deviation:
        type: double
        default_value: 1.0
        description: fall back to connecting from ego when ego is laterally farther than this from the previous trajectory [m]
        validation:
          gt<>: [0.0]

      max_yaw_deviation:
        type: double
        default_value: 0.524
        description: fall back to connecting from ego when ego's yaw deviates more than this from the previous trajectory [rad]
        validation:
          gt<>: [0.0]

  map_based_stop:
    stop_margin_distance:
      type: double
      default_value: 0.0
      description: distance to stop before the stop line crossing point (in addition to the vehicle front offset) [m]
      validation:
        gt_eq<>: [0.0]
    stop_distance_from_crosswalk:
      type: double
      default_value: 3.5
      description: distance to stop before a crosswalk/walkway that has no explicit stop line in the map (added to stop_margin_distance and the vehicle front offset) [m]
      validation:
        gt_eq<>: [0.0]
    stop_distance_from_private_area:
      type: double
      default_value: 3.0
      description: distance to stop before a private-area boundary (added to stop_margin_distance and the vehicle front offset) [m]
      validation:
        gt_eq<>: [0.0]
    stop_distance_from_intersection:
      type: double
      default_value: 1.0
      description: distance to stop before the first conflicting priority lane in an intersection (added to stop_margin_distance and the vehicle front offset) [m]
      validation:
        gt_eq<>: [0.0]
    max_deceleration:
      type: double
      default_value: 4.0
      description: maximum deceleration used to judge whether a stop line is reachable (braking distance) [m/s^2]
      validation:
        gt<>: [0.0]
    max_jerk:
      type: double
      default_value: 5.0
      description: maximum jerk used for the jerk-aware braking distance in the reachability judgement [m/s^3]
      validation:
        gt<>: [0.0]
    stop_point_diff_threshold:
      type: double
      default_value: 0.5
      description: minimum arc-length difference for the stop trajectory's stop point to be treated as different from the go trajectory's [m]
      validation:
        gt<>: [0.0]

  obstacle_stop:
    enable:
      type: bool
      default_value: true
      description: enable obstacle stop
    use_objects:
      type: bool
      default_value: true
      description: use objects for obstacle stop
    use_pointcloud:
      type: bool
      default_value: true
      description: use pointcloud for obstacle stop
    enable_stop_for_objects:
      type: bool
      default_value: true
      description: enable stop for objects
    enable_stop_for_pointcloud:
      type: bool
      default_value: false
      description: enable stop for pointcloud
    stop_margin:
      type: double
      default_value: 6.0
      description: stop margin for obstacle stop [m]
    nominal_stopping_decel:
      type: double
      default_value: 1.0
      description: nominal stopping deceleration [m/s^2]
    maximum_stopping_decel:
      type: double
      default_value: 4.0
      description: maximum stopping deceleration [m/s^2]
    stopping_jerk:
      type: double
      default_value: 3.0
      description: stopping jerk [m/s^3]
    on_time_buffer:
      type: double
      default_value: 0.5
      description: time buffer before obstacle stop [s]
    off_time_buffer:
      type: double
      default_value: 1.0
      description: time buffer after obstacle stop [s]
    lateral_margin:
      type: double
      default_value: 0.2
      description: lateral margin for obstacle stop [m]
    arrived_distance_threshold:
      type: double
      default_value: 0.5
      description: threshold to check if the ego vehicle has arrived at the stop point [m]
      validation:
        bounds<>: [0.0, 10.0]
    objects:
      object_types:
        type: string_array
        default_value: [car, truck, bus, trailer, motorcycle, bicycle, pedestrian, hazard]
        description: object types to consider for obstacle stop
      stopped_velocity_th:
        type: double
        default_value: 0.3
        description: velocity threshold for target object to be considered as stopped [m/s]
      max_lateral_velocity_th:
        type: double
        default_value: 1.0
        description: maximum lateral velocity threshold for target object to be considered for obstacle stop [m/s]
        validation:
          bounds<>: [0.0, 10.0]
      safety_buffer:
        type: double
        default_value: 0.1
        description: safety buffer to expand object shape [m]
        validation:
          bounds<>: [0.0, 10.0]
    pointcloud:
      height_buffer:
        type: double
        default_value: 0.5
        description: height buffer to add above ego height [m]
        validation:
          bounds<>: [0.0, 10.0]
      min_height:
        type: double
        default_value: 0.2
        description: minimum height of pointcloud [m]
        validation:
          bounds<>: [0.0, 10.0]
      voxel_grid_filter:
        x:
          type: double
          default_value: 0.2
          description: x size of voxel grid filter [m]
          validation:
            bounds<>: [0.0, 1.0]
        y:
          type: double
          default_value: 0.2
          description: y size of voxel grid filter [m]
          validation:
            bounds<>: [0.0, 1.0]
        z:
          type: double
          default_value: 0.2
          description: z size of voxel grid filter [m]
          validation:
            bounds<>: [0.0, 1.0]
        min_size:
          type: int
          default_value: 3
          description: minimum size of voxel grid filter
          validation:
            bounds<>: [1, 100]
      clustering:
        tolerance:
          type: double
          default_value: 0.5
          description: tolerance for clustering [m]
          validation:
            bounds<>: [0.0, 1.0]
        min_height:
          type: double
          default_value: 0.5
          description: minimum height for clustering [m]
          validation:
            bounds<>: [0.0, 1.0]
        min_size:
          type: int
          default_value: 10
          description: minimum size for clustering
          validation:
            bounds<>: [1, 100]
        max_size:
          type: int
          default_value: 10000
          description: maximum size for clustering
          validation:
            bounds<>: [1, 10000]
    rss_params:
      enable:
        type: bool
        default_value: true
        description: enable the use of RSS parameters for obstacle stop
      object_decel:
        car:
          type: double
          default_value: 1.6
          description: deceleration for car type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
        truck:
          type: double
          default_value: 1.6
          description: deceleration for truck type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
        bus:
          type: double
          default_value: 1.6
          description: deceleration for bus type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
        trailer:
          type: double
          default_value: 1.6
          description: deceleration for trailer type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
        motorcycle:
          type: double
          default_value: 2.0
          description: deceleration for motorcycle type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
        bicycle:
          type: double
          default_value: 3.0
          description: deceleration for bicycle type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
        pedestrian:
          type: double
          default_value: 5.0
          description: deceleration for pedestrian type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
      ego_decel:
        type: double
        default_value: 2.0
        description: deceleration for ego vehicle used in RSS calculation [m/s^2]
        validation:
          bounds<>: [0.0, 10.0]
      reaction_time:
        type: double
        default_value: 0.4
        description: reaction time used in RSS calculation [s]
        validation:
          bounds<>: [0.0, 10.0]
      safety_margin:
        type: double
        default_value: 3.0
        description: safety margin used in RSS calculation [m]
        validation:
          bounds<>: [0.0, 10.0]
      lookahead_horizon:
        type: double
        default_value: 1.5
        description: lookahead horizon used in RSS calculation [s]
        validation:
          bounds<>: [0.0, 10.0]

  surround_obstacle_stop:
    enable:
      type: bool
      default_value: true
      description: enable surround obstacle stop
      read_only: false
    use_objects:
      type: bool
      default_value: true
      description: enable the use of objects for surround obstacle stop
      read_only: false
    use_pointcloud:
      type: bool
      default_value: false
      description: enable the use of pointcloud for surround obstacle stop
      read_only: false
    object_types:
      type: string_array
      default_value:
        [car, truck, bus, trailer, motorcycle, bicycle, pedestrian, hazard, animal, unknown]
      description: types of objects to consider for surround obstacle stop
      read_only: false
    base_distance_th:
      &distance_th_template {
        type: double,
        default_value: 0.5,
        validation: { bounds<>: [0.0, 10.0] },
        read_only: false,
      }
    base:
      &base_template {
        car: *distance_th_template,
        truck: *distance_th_template,
        bus: *distance_th_template,
        trailer: *distance_th_template,
        motorcycle: *distance_th_template,
        bicycle: *distance_th_template,
        pedestrian: *distance_th_template,
        hazard: *distance_th_template,
        animal: *distance_th_template,
        unknown: *distance_th_template,
        pointcloud: *distance_th_template,
      }
    front_distance_th: *base_template
    side_distance_th: *base_template
    back_distance_th: *base_template
    hysteresis_distance:
      type: double
      default_value: 0.1
      description: distance hysteresis threshold for clearing surround stop [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    hysteresis_time:
      type: double
      default_value: 0.2
      description: time hysteresis threshold for clearing surround stop [s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    ego_stopped_vel_th:
      type: double
      default_value: 0.1
      description: velocity threshold below which ego vehicle is considered stopped [m/s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false

  debug:
    enable_path:
      type: bool
      default_value: true
      description: publish debug path_with_lane_id

    enable_output_trajectory:
      type: bool
      default_value: true
      description: publish debug final output trajectory

    enable_shifted_trajectory:
      type: bool
      default_value: true
      description: publish debug shifted trajectory

    enable_goal_maneuver_trajectory:
      type: bool
      default_value: true
      description: publish debug trajectory right after the goal maneuver (before the start maneuver / connection)

    enable_optimizer_trajectory:
      type: bool
      default_value: true
      description: publish debug optimizer module trajectories

    enable_modifier_trajectory:
      type: bool
      default_value: true
      description: publish debug modifier module trajectories

  # Post-optimization resample parameters
  post_resample:
    max_trajectory_length:
      type: double
      default_value: 300.0
      description: max trajectory length for post-optimization resampling [m]

    min_trajectory_length:
      type: double
      default_value: 30.0
      description: min trajectory length for post-optimization resampling [m]

    resample_time:
      type: double
      default_value: 10.0
      description: resample total time for dense sampling after optimization [s]

    dense_resample_dt:
      type: double
      default_value: 0.1
      description: resample time interval for dense sampling after optimization [s]

    dense_min_interval_distance:
      type: double
      default_value: 0.1
      description: minimum points-interval length for dense sampling after optimization [m]

    sparse_resample_dt:
      type: double
      default_value: 0.1
      description: resample time interval for sparse sampling after optimization [s]

    sparse_min_interval_distance:
      type: double
      default_value: 1.0
      description: minimum points-interval length for sparse sampling after optimization [m]
